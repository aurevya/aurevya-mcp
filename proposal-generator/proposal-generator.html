/* Section keys currently switched on, in deck order. Used by anything that
   has to know what the finished deck contains before it's rendered —
   picking the six- or eight-leaf wheel, for one. */
function activeSections(){
  const p=currentSpec();
  const all=p.sections.slice();
  SERVICE_SECTIONS.forEach(s=>{if(all.indexOf(s)<0)all.push(s);});
  return all.filter(s=>STATE.sections?STATE.sections[s]:p.sections.indexOf(s)>=0);
}

/* Every service page that can be switched on, whether or not this
   proposal type offers it by default — so the set is genuinely selectable
   rather than fixed at six. */
const SERVICE_SECTIONS=['svc_board','svc_directorship','svc_accounting','svc_legal',
  'svc_compliance','svc_governance','svc_it','svc_concierge','svc_media'];

/* `preserve` keeps whatever the user has already ticked or unticked, and is
   used when the list changes underneath them — adding an entity on the
   canvas brings new pages in without undoing their earlier choices. Called
   with no argument (a full reset) when the proposal type itself changes. */
function renderSectionToggles(preserve){
  const p=currentSpec();
  const box=$('sectionToggles');box.innerHTML='';
  const prev=preserve?(STATE.sections||{}):{};
  STATE.sections={};
  const all=p.sections.slice();
  if(!all.includes('disclaimer'))all.unshift('disclaimer');
  /* offer the remaining service pages as unticked options, positioned
     after the ones this proposal already includes */
  SERVICE_SECTIONS.forEach(s=>{if(!all.includes(s))all.push(s);});
  all.forEach(s=>{
    const on=(s in prev)?prev[s]:p.sections.includes(s);
    STATE.sections[s]=on;
    const lbl=SECTION_LABELS[s]||[s,''];
    const d=document.createElement('label');d.className='checkline';
    d.innerHTML='<input type="checkbox" '+(on?'checked':'')+
      ' onchange="STATE.sections[\''+s+'\']=this.checked">'+
      '<span>'+lbl[0]+(lbl[1]?'<span class="d">'+lbl[1]+'</span>':'')+'</span>';
    box.appendChild(d);
  });
}

function renderStructFields(){
  /* the diagram is about to be re-seeded, so any open entity panel is
     pointing at a node id that's on its way out */
  closeEntityPanel();
  const p=currentSpec();
  if(!p.structure){$('structFields').innerHTML='<div style="font-size:11px;color:#94A3AE;">This proposal type has no structure diagram.</div>';STATE.struct=null;return;}
  /* only re-seed the default layout when the proposal type/entities
     change (i.e. whenever this function runs) — drag positions, added
     nodes and edited labels otherwise survive every other edit, since
     nothing else calls renderStructFields */
  STATE.struct=JSON.parse(JSON.stringify(p.structure));
  renderStructEditorUI();
}

/* redraw the sidebar's node/edge list for whatever STATE.struct
   currently is — called after every add/remove, independently of the
   full renderStructFields() reset above */
function renderStructEditorUI(){
  const box=$('structFields');
  const st=STATE.struct;
  if(!st||!st.nodes){box.innerHTML='<div style="font-size:11px;color:#94A3AE;">This proposal type has no structure diagram.</div>';return;}

  let html='<div style="font-size:10.5px;color:#8D9AA5;line-height:1.4;margin-bottom:8px;">Drag any box directly on the diagram to reposition it.</div>';

  st.nodes.forEach((n,i)=>{
    const isCore=CORE_NODE_IDS.includes(n.id);
    html+='<label class="f"><span>'+KIND_LABEL[n.kind]+' '+(i+1)+
      (isCore?' <span class="hint">— Section 1</span>':'')+'</span>'+
      '<div style="display:flex;gap:5px;align-items:center">'+
      '<input type="text" style="flex:1" value="'+n.label.replace(/<br>/g,' ').replace(/"/g,'&quot;')+'" '+
      'oninput="STATE.struct.nodes['+i+'].label=this.value;redrawStructure()">'+
      (st.nodes.length>1?'<button type="button" class="ghost" style="width:auto;padding:6px 9px;margin:0" onclick="removeAnyNode(\''+n.id+'\')">✕</button>':'')+
      '</div></label>';
  });

  if(st.edges.length){
    html+='<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:10px 0 6px;">Connections</div>';
    st.edges.forEach((e,i)=>{
      html+='<div class="row2" style="align-items:end;margin-bottom:4px">'+
        '<label class="f" style="margin-bottom:0"><span>From</span>'+nodeSelect('STATE.struct.edges['+i+'].from',e.from,st.nodes)+'</label>'+
        '<label class="f" style="margin-bottom:0"><span>To</span>'+nodeSelect('STATE.struct.edges['+i+'].to',e.to,st.nodes)+'</label>'+
        '</div>'+
        '<div style="display:flex;gap:5px;align-items:center;margin-bottom:10px">'+
        '<input type="text" style="flex:1" placeholder="Label, e.g. 100%" value="'+(e.label||'').replace(/"/g,'&quot;')+'" '+
        'oninput="STATE.struct.edges['+i+'].label=this.value;redrawStructure()">'+
        '<button type="button" class="ghost" style="width:auto;padding:6px 9px;margin:0" onclick="removeStructEdge(\''+e.id+'\')">✕</button>'+
        '</div>';
    });
  }

  const ent=STATE.entities||{};
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px">'+
    '<button type="button" class="ghost" style="margin:0" onclick="addStructNode(\'shareholder\')">+ Shareholder</button>'+
    '<button type="button" class="ghost" style="margin:0" onclick="addStructNode(\'box\')">+ Entity box</button>'+
    (STATE.mode==='structure'&&!ent.trust?'<button type="button" class="ghost" style="margin:0" onclick="addCoreEntity(\'trust\')">+ Trust</button>':'')+
    (STATE.mode==='structure'&&!ent.cis?'<button type="button" class="ghost" style="margin:0" onclick="addCoreEntity(\'cis\')">+ CIS</button>':'')+
    (STATE.mode==='structure'&&ent.cis?'<button type="button" class="ghost" style="margin:0" onclick="addStructNode(\'ciscell\')">+ CIS Cell</button>':'')+
    '<button type="button" class="ghost" style="margin:0" onclick="addStructEdge()">+ Connection</button>'+
    '</div>'+
    '<button type="button" class="ghost" onclick="resetStructure()">Reset diagram to default</button>'+
    '<label class="f" style="margin-top:10px"><span>Diagram note <span class="hint">(optional)</span></span>'+
    '<textarea oninput="STATE.struct.note=this.value;redrawStructure()">'+(st.note||'')+'</textarea></label>';

  box.innerHTML=html;
}

function nodeSelect(path,val,nodes){
  return '<select onchange="'+path+'=this.value;redrawStructure()">'+
    nodes.map(n=>'<option value="'+n.id+'"'+(n.id===val?' selected':'')+'>'+n.label.replace(/<br>/g,' ')+'</option>').join('')+
    '</select>';
}

/* re-render the live preview without re-seeding the diagram — used by
   every sidebar edit (label text, connections, add/remove buttons) */
function redrawStructure(){liveBuild(0);}

/* these ids come straight from Section 1 (Company/Trust/CIS toggles),
   so they're not removable from the diagram directly — deleting one
   there without also unchecking Section 1 would leave the fee table,
   the glossary and the document sections out of sync with what the
   diagram shows. Everything else added from the diagram's own "+"
   controls (extra shareholders, entity boxes, CIS cells) is fair game. */
const CORE_NODE_IDS=['ac','gbc','trust','cis'];

let _structSeq=1;
function newStructId(){return 'x'+(_structSeq++)+'_'+Date.now().toString(36);}

/* Keeps the price book's "Each additional cell" line in step with how
   many CIS cell boxes are actually on the diagram. The base PRICEBOOK.cis
   entry already covers the first cell (in "PCC incorporation and first
   cell"); this line only covers cells beyond that one. If the user has
   already retyped that line into something else, it's left alone — once
   someone takes manual control of a fee line we stop auto-managing it. */
function syncCellFees(){
  if(STATE.mode!=='structure'||!STATE.entities.cis||!STATE.struct)return;
  const cellCount=STATE.struct.nodes.filter(n=>n.kind==='ciscell').length;
  const extra=Math.max(0,cellCount-1);
  ['setup','fixed'].forEach(which=>{
    const base=(PRICEBOOK.cis[which]||[]).find(r=>r.t==='item'&&/each additional cell/i.test(r.l));
    const line=STATE.fees[which].find(r=>r.t==='item'&&/each additional cell/i.test(r.l));
    if(!base||!line)return;
    if(extra>0){line.l='Each additional cell (× '+extra+')';line.v=base.v*extra;}
    else{line.l='Each additional cell';line.v=0;}
  });
  renderFeeEditor();
}

function defaultConnectTarget(st,kind){
  if(kind==='ciscell'){
    const cis=st.nodes.find(n=>n.kind==='box'&&/CIS/.test(n.label));
    return cis?cis.id:(st.nodes[st.nodes.length-1]?st.nodes[st.nodes.length-1].id:null);
  }
  const anchor=st.nodes.find(n=>n.kind==='box');
  return anchor?anchor.id:(st.nodes[0]?st.nodes[0].id:null);
}

/* every node reachable by following edges forward from startId,
   including startId itself — used to shift a whole downstream branch
   out of the way when a new box gets spliced into the middle of it */
function collectDownstream(st,startId){
  const seen=new Set(),queue=[startId];
  while(queue.length){
    const cur=queue.pop();
    if(seen.has(cur))continue;
    seen.add(cur);
    st.edges.filter(e=>e.from===cur).forEach(e=>queue.push(e.to));
  }
  return seen;
}

/* "+ Trust" / "+ CIS" on the canvas toolbar — unlike a generic "+ Entity"
   box, these are real Section-1 entities: they need the actual Trust/CIS
   document sections, glossary terms and price-book fees to switch on,
   not just an inert box. So this flips the same STATE.entities flag the
   Section 1 checkbox does (and checks that checkbox to match), then
   splices the node into whatever diagram is already there instead of
   reseeding the whole thing — existing shareholders, entity boxes, cells
   and drag positions are left untouched. */
function addCoreEntity(kind){
  if(STATE.mode!=='structure'||!STATE.struct||STATE.entities[kind])return;
  STATE.entities[kind]=true;
  const cb=$(kind==='trust'?'fTrust':'fCis');if(cb)cb.checked=true;
  resetFees();
  renderSectionToggles();
  spliceCoreNode(kind);
  syncCellFees();
  renderStructEditorUI();
  redrawStructure();
}

function spliceCoreNode(kind){
  const st=STATE.struct,bd=NODE_DIM.box;
  if(kind==='trust'){
    if(st.nodes.some(n=>n.id==='trust'))return;
    const sh=st.nodes.find(n=>n.kind==='shareholder')||st.nodes[0];
    const outEdge=st.edges.find(e=>e.from===sh.id);
    if(outEdge){
      collectDownstream(st,outEdge.to).forEach(id=>{
        const n=st.nodes.find(x=>x.id===id);if(n)n.y+=34;
      });
    }
    const cx=sh.x+(NODE_DIM.shareholder.w/2);
    const node={id:'trust',kind:'box',label:'TRUST',x:cx-bd.w/2,y:sh.y+34,primary:false,cap:''};
    st.nodes.push(node);
    st.edges.push({id:newStructId(),from:sh.id,to:'trust',label:''});
    if(outEdge)outEdge.from='trust';else node.primary=true;
    if(sh.label==='SHAREHOLDER')sh.label='SETTLOR';
  }else if(kind==='cis'){
    if(st.nodes.some(n=>n.id==='cis'))return;
    const anchor=st.nodes.find(n=>n.primary)||st.nodes.find(n=>n.kind==='shareholder')||st.nodes[0];
    const ad=nodeDim(anchor);
    const cx=anchor.x+ad.w/2;
    const y=anchor.y+34;
    const node={id:'cis',kind:'box',label:'CIS — PROTECTED<br>CELL COMPANY',x:cx-bd.w/2,y:y,primary:true,cap:''};
    anchor.primary=false;
    st.nodes.push(node);
    st.edges.push({id:newStructId(),from:anchor.id,to:'cis',label:'100%'});
    const cd=NODE_DIM.ciscell,cellY=y+bd.h+2;
    st.nodes.push({id:'cellA',kind:'ciscell',label:'CELL A',x:cx-cd.w-4,y:cellY,primary:false,cap:''});
    st.nodes.push({id:'cellB',kind:'ciscell',label:'CELL B',x:cx+4,y:cellY,primary:false,cap:''});
    st.edges.push({id:newStructId(),from:'cis',to:'cellA',label:''});
    st.edges.push({id:newStructId(),from:'cis',to:'cellB',label:''});
  }
  const t=structTitleFor(STATE.entities);
  st.title=t.title;st.sub=t.sub;
  st.canvasH=Math.max(st.canvasH,st.nodes.reduce((m,n)=>Math.max(m,n.y+nodeDim(n).h),0)+14);
}

/* the reverse of addCoreEntity() — deleting Trust, CIS, or the Company
   box directly from the canvas. It unchecks the matching Section 1
   control, rebuilds fees/sections the same way unchecking it by hand
   would, then repairs the diagram: whatever was upstream of the removed
   box gets reconnected straight to whatever was downstream of it, and a
   removed CIS takes its cells with it. Refuses to leave a completely
   empty structure. `slot` is 'company' | 'trust' | 'cis'. */
function removeCoreEntity(slot){
  if(STATE.mode!=='structure'||!STATE.struct)return;
  let nodeId;
  if(slot==='company'){
    if(STATE.entities.company==='none')return;
    if(!STATE.entities.trust&&!STATE.entities.cis){
      alert('A structure needs at least one entity. Add a Trust or CIS first, or change the company type in Section 1.');
      return;
    }
    nodeId=STATE.entities.company;
    STATE.entities.company='none';
    const sel=$('fCompany');if(sel)sel.value='none';
  }else{
    if(!STATE.entities[slot])return;
    const otherActive=(STATE.entities.company!=='none')||(slot==='trust'?STATE.entities.cis:STATE.entities.trust);
    if(!otherActive){
      alert('A structure needs at least one entity. Add another entity first, or change this in Section 1.');
      return;
    }
    nodeId=slot;
    STATE.entities[slot]=false;
    const cb=$(slot==='trust'?'fTrust':'fCis');if(cb)cb.checked=false;
  }
  resetFees();
  renderSectionToggles();
  removeCoreNodeFromStruct(nodeId);
  syncCellFees();
  renderStructEditorUI();
  redrawStructure();
}

function removeCoreNodeFromStruct(id){
  const st=STATE.struct;if(!st)return;
  const node=st.nodes.find(n=>n.id===id);if(!node)return;

  /* a removed CIS takes its cells with it */
  const childIds=new Set();
  if(id==='cis')collectDownstream(st,id).forEach(cid=>{if(cid!==id)childIds.add(cid);});

  /* bridge the gap: reconnect whatever pointed at this node straight to
     whatever this node pointed at, so the chain doesn't break in two */
  const incoming=st.edges.filter(e=>e.to===id);
  const outgoing=st.edges.filter(e=>e.from===id&&!childIds.has(e.to));
  st.edges=st.edges.filter(e=>e.from!==id&&e.to!==id);
  incoming.forEach(inE=>{
    outgoing.forEach(outE=>{
      st.edges.push({id:newStructId(),from:inE.from,to:outE.to,label:outE.label||inE.label||''});
    });
  });

  st.nodes=st.nodes.filter(n=>n.id!==id&&!childIds.has(n.id));
  st.edges=st.edges.filter(e=>!childIds.has(e.from)&&!childIds.has(e.to));
  childIds.forEach(cid=>{
    ['setup','fixed'].forEach(which=>{STATE.fees[which]=STATE.fees[which].filter(r=>r._nodeId!==cid);});
  });

  /* promote a new headline entity if the one that was primary just left */
  if(node.primary){
    const terminal=st.nodes.find(n=>n.kind!=='shareholder'&&!st.edges.some(e=>e.from===n.id));
    if(terminal)terminal.primary=true;
  }
  /* no trust left upstream — the settlor is just a shareholder again */
  if(id==='trust'){
    const sh=st.nodes.find(n=>n.kind==='shareholder');
    if(sh&&sh.label==='SETTLOR')sh.label='SHAREHOLDER';
  }

  const t=structTitleFor(STATE.entities);
  st.title=t.title;st.sub=t.sub;
}

/* single entry point for every on-canvas delete control — routes to the
   Section-1-aware removeCoreEntity() for the four core boxes, or the
   plain removeStructNode() for anything the user added themselves */
function removeAnyNode(id){
  if(id==='ac'||id==='gbc')removeCoreEntity('company');
  else if(id==='trust'||id==='cis')removeCoreEntity(id);
  else removeStructNode(id);
}

function addStructNode(kind){
  const st=STATE.struct;if(!st)return;
  if(kind==='ciscell'&&!STATE.entities.cis)return; /* add a CIS first */
  const d=NODE_DIM[kind]||NODE_DIM.box;
  const id=newStructId();
  const defaults={shareholder:'SHAREHOLDER',box:'ENTITY',ciscell:'NEW CELL'};
  const count=st.nodes.filter(n=>n.kind===kind).length;
  const maxY=st.nodes.reduce((m,n)=>Math.max(m,n.y+nodeDim(n).h),0);
  const x=8+count*(d.w+6);
  const y=kind==='shareholder'?8:Math.min(maxY+10,st.canvasH-d.h-4);
  st.nodes.push({id:id,kind:kind,label:defaults[kind],x:x,y:y,primary:false,cap:''});
  let target=defaultConnectTarget(st,kind);
  /* A second shareholder should join the same entity the first one holds,
     so the two form a single bus into it rather than pointing at different
     boxes. */
  if(kind==='shareholder'){
    const sibling=st.edges.find(e=>{
      const from=st.nodes.find(n=>n.id===e.from);
      return from&&from.kind==='shareholder'&&from.id!==id;
    });
    if(sibling)target=sibling.to;
  }
  if(target){
    if(kind==='ciscell')st.edges.push({id:newStructId(),from:target,to:id,label:''});
    else st.edges.push({id:newStructId(),from:id,to:target,label:''});
  }
  if(kind==='shareholder')layoutShareholderRow(st);
  st.canvasH=Math.max(st.canvasH,y+d.h+12);

  /* keep the fee table honest about whatever just got added to the
     diagram — a scaled line for CIS cells, a reminder line for a
     custom entity box there's no price-book entry for */
  if(kind==='ciscell'){
    syncCellFees();
  }else if(kind==='box'){
    ['setup','fixed'].forEach(which=>{
      STATE.fees[which].push({t:'item',l:'Additional entity — set fee',v:0,_nodeId:id});
    });
    renderFeeEditor();
  }

  renderStructEditorUI();
  redrawStructure();
}

/* After a company box is deleted, the survivors keep their original
   numbers — leaving "Authorised Company 1" next to "Authorised Company 3".
   Renumber the remaining ones in diagram order (top to bottom) so the
   labels, captions and fee-column headings stay consistent, and drop the
   count to match. Only touches boxes still carrying the auto-generated
   "<name> <n>" label; anything renamed by hand is left alone. */
function renumberCompanyBoxes(){
  const ent=STATE.entities;const st=STATE.struct;
  if(!st||STATE.mode!=='structure'||ent.company==='none')return;
  const meta=ENTITY_META[ent.company];if(!meta)return;
  const base=(ent.company==='gbc'?'GLOBAL BUSINESS<br>COMPANY':'AUTHORISED<br>COMPANY');
  const auto=new RegExp('^'+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\s+\\d+)?$');
  const boxes=companyBoxes();
  if(!boxes.length)return;
  const n=boxes.length;
  /* Labels and captions only — ids stay put, because edges and the _nodeId
     tags on fee rows both reference them. Column mapping goes by position
     (see feeColIndexForNode), so it survives renumbering either way. */
  boxes.forEach((b,i)=>{
    if(auto.test(b.label))b.label=n>1?base+' '+(i+1):base;
    if(b.cap==='Holding Company'||b.cap==='Operational Company'||!b.cap){
      b.cap=n>1?(i===0?'Holding Company':'Operational Company'):'';
    }
  });
  if(companyCount(ent)!==n){
    ent.companyCount=n;
    const sel=$('fCompanyCount');
    if(sel&&n<=3)sel.value=String(n);
    /* Keep the columns belonging to the boxes that are still here, in
       diagram order, and drop the rest — rather than rebuilding, which
       would discard every edited price and every add-on, or trimming from
       the end, which would drop the wrong entity's column when the deleted
       company was in the middle. */
    if(n>1&&STATE.feeCols&&STATE.feeCols.length>n){
      const kept=boxes.map(b=>STATE.feeCols.find(c=>c.nodeId===b.id)).filter(Boolean);
      STATE.feeCols=(kept.length===n?kept:STATE.feeCols.slice(0,n));
      STATE.feeCols.forEach((c,i)=>{c.label=feeColLabel(ent,i);c.nodeId=boxes[i].id;});
    }else if(n<=1&&STATE.feeCols&&STATE.feeCols.length){
      /* down to a single company: fold the survivor's rows back into the
         shared list so the page returns to the one-column layout */
      const keep=(boxes.length?STATE.feeCols.find(c=>c.nodeId===boxes[0].id):null)||STATE.feeCols[0];
      ['setup','fixed'].forEach(which=>{
        STATE.fees[which]=keep[which].concat(STATE.fees[which]);
      });
      STATE.feeCols=[];
    }
    renderFeeEditor();
  }
}

/* The company boxes on the diagram, top to bottom — the order the fee
   columns are in. Matched on the auto-generated label prefix so a box the
   user added by hand isn't mistaken for one of the seeded companies. */
function companyBoxes(){
  const ent=STATE.entities,st=STATE.struct;
  if(!st||STATE.mode!=='structure'||ent.company==='none')return [];
  const base=(ent.company==='gbc'?'GLOBAL BUSINESS<br>COMPANY':'AUTHORISED<br>COMPANY');
  const esc=base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const auto=new RegExp('^'+esc+'(\\s+\\d+)?$');
  return st.nodes.filter(n=>n.kind==='box'&&(auto.test(n.label)||
    (n.id||'').match(new RegExp('^'+ent.company+'\\d*$')))).sort((a,b)=>a.y-b.y);
}

function removeStructNode(id){
  const st=STATE.struct;if(!st||st.nodes.length<=1)return;
  if(CORE_NODE_IDS.includes(id))return; /* use the Section 1 toggles instead */
  const removed=st.nodes.find(n=>n.id===id);
  st.nodes=st.nodes.filter(n=>n.id!==id);

  /* Bridge the gap rather than just dropping every edge that touched the
     node: deleting the middle box of a chain previously left whatever hung
     below it orphaned, with no connector at all. Re-point each inbound
     edge's source at each outbound edge's target instead. */
  const parentIds=st.edges.filter(e=>e.to===id).map(e=>e.from);
  const parents=st.edges.filter(e=>e.to===id);
  const children=st.edges.filter(e=>e.from===id);
  st.edges=st.edges.filter(e=>e.from!==id&&e.to!==id);
  parents.forEach(p=>children.forEach(c=>{
    if(p.from===c.to)return;                                  /* no self-loop */
    if(st.edges.some(e=>e.from===p.from&&e.to===c.to))return;  /* already linked */
    st.edges.push({id:newStructId(),from:p.from,to:c.to,label:c.label||p.label||''});
  }));

  const hadFeeLine=['setup','fixed'].some(which=>
    allFeeLists(which).some(list=>list.some(r=>r._nodeId===id)));
  ['setup','fixed'].forEach(which=>{
    allFeeLists(which).forEach(list=>{
      for(let i=list.length-1;i>=0;i--)if(list[i]._nodeId===id)list.splice(i,1);
    });
  });
  renumberCompanyBoxes();
  if(removed&&removed.kind==='shareholder')layoutShareholderRow(st);
  /* whatever fed the deleted box may now have a different number of
     children — re-space them so the row stays centred */
  parentIds.forEach(pid=>layoutChildren(st,pid));
  /* if that was the last box of its kind, its pages and glossary terms go
     with it — the deck shouldn't keep explaining a trust it no longer has */
  if(removed&&removed.entKey){
    syncExtraKinds();
    renderSectionToggles(true);
  }
  if(removed&&removed.kind==='ciscell')syncCellFees();
  else if(hadFeeLine)renderFeeEditor();

  renderStructEditorUI();
  redrawStructure();
}

/* ── per-entity add-ons ───────────────────────────────────────────
   Clicking a box on the diagram opens a panel for that entity alone:
   what to charge on it, and its label/caption/ownership. Fees added here
   are tagged with the node's id (_nodeId) and its add-on key (_addon), so
   they can be toggled back off and are removed automatically if the box
   itself is deleted — the same mechanism the CIS cells already use.

   Where the charge lands matters when several companies each have their
   own fee column: an add-on on Authorised Company 2 belongs in that
   column's total, not in the shared block. feeTargetForNode() resolves
   that from the node id, which is why the seeded ids are ac1/ac2/ac3.
   ───────────────────────────────────────────────────────────────── */
const ENTITY_ADDONS={
  bank:{label:'Bank account opening',hint:'per additional account',
    setup:[{l:'Bank Account Opening (per Account)',v:4000}],fixed:[]},
  nominee:{label:'Nominee shareholder',hint:'Aurevya holds the shares — AC only',acOnly:true,
    setup:[{l:'Nominee shareholder',v:2000}],fixed:[{l:'Nominee shareholder',v:2000}]},
  accounting:{label:'Accounting & tax filing',hint:'minimum 3,000/year',
    setup:[],fixed:[{l:'Accounting — preparation and filing of accounts and tax returns',v:3000}]},
  trc:{label:'Tax Residency Certificate',hint:'application + annual renewal',
    setup:[{l:'Tax Residency Certificate application',v:200}],fixed:[{l:'Tax residence Certificate',v:200}]}
};

/* ── entities that can be hung off any node ───────────────────────
   So the canvas can express structures the sidebar's fixed
   company/trust/CIS combination doesn't cover — a second trust under an
   operating company, a foundation beside a GBC, a domestic subsidiary,
   and so on. Each carries the price-book key its fees come from; the ones
   with no key get a zero-value placeholder line to be priced by hand.

   Fees land in the shared list tagged with the new node's id, so deleting
   the box takes its fees with it. Section pages are NOT switched on by
   this — those follow the Section 1 toggles, because adding a fourth
   entity to a diagram rarely means the deck should gain another set of
   explanatory pages. */
const ADDABLE_ENTITIES=[
  {key:'ac',        name:'Authorised Company',       box:'AUTHORISED<br>COMPANY',        price:'ac'},
  {key:'gbc',       name:'Global Business Company',  box:'GLOBAL BUSINESS<br>COMPANY',   price:'gbc'},
  {key:'trust',     name:'Trust',                    box:'TRUST',                        price:'trust'},
  {key:'cis',       name:'CIS — Protected Cell Co.', box:'CIS — PROTECTED<br>CELL COMPANY',price:'cis'},
  {key:'mfo',       name:'Multi-Family Office',      box:'MULTI-FAMILY<br>OFFICE',       price:'mfo'},
  {key:'foundation',name:'Foundation',               box:'FOUNDATION',                   price:null},
  {key:'domestic',  name:'Domestic Company',         box:'DOMESTIC<br>COMPANY',          price:null},
  {key:'partnership',name:'Limited Partnership',     box:'LIMITED<br>PARTNERSHIP',       price:null},
  {key:'other',     name:'Blank box',                box:'ENTITY',                       price:null}
];

/* Attach a new entity below the clicked one, wired parent → child. */
function addEntityUnder(parentId,key){
  const spec=ADDABLE_ENTITIES.find(e=>e.key===key);if(!spec)return;
  const st=STATE.struct;if(!st)return;
  const parent=st.nodes.find(n=>n.id===parentId);if(!parent)return;
  const pd=nodeDim(parent);
  const d=NODE_DIM.box;
  const id=newStructId();

  /* directly beneath the parent, stepping down past anything already
     occupying that slot so a new box never lands on top of an existing one */
  const x=Math.max(0,Math.min(st.canvasW-d.w,parent.x+pd.w/2-d.w/2));
  const y=parent.y+pd.h+20;

  /* entKey records what kind of thing this box is, so its explanatory
     pages and glossary terms can follow it in and out of the deck */
  st.nodes.push({id:id,kind:'box',entKey:spec.key,label:spec.box,x:x,y:y,primary:false,cap:''});
  st.edges.push({id:newStructId(),from:parentId,to:id,label:'100%'});
  st.canvasH=Math.max(st.canvasH,y+d.h+16);
  /* spread this parent's children across a row if there's now more than one */
  layoutChildren(st,parentId);

  if(spec.price){
    ['setup','fixed'].forEach(which=>{
      composeFees([spec.price],which).forEach(r=>{
        STATE.fees[which].push(Object.assign({},r,{_nodeId:id}));
      });
      /* the appended block brings its own disbursement heading, so fold it
         back into the single group at the end rather than leaving a second
         one part-way down the table */
      STATE.fees[which]=regroupDisbursements(STATE.fees[which]);
    });
  }else{
    ['setup','fixed'].forEach(which=>{
      STATE.fees[which].push({t:'grp',l:spec.name.toUpperCase(),_nodeId:id});
      STATE.fees[which].push({t:'item',l:spec.name+' — set fee',v:0,_nodeId:id});
      /* keep the disbursement group last even after a plain entity is added */
      STATE.fees[which]=regroupDisbursements(STATE.fees[which]);
    });
  }

  /* bring in this entity's own pages and glossary terms, keeping any
     section the user has already turned on or off */
  syncExtraKinds();
  renderFeeEditor();
  renderSectionToggles(true);
  renderStructEditorUI();
  redrawStructure();
  liveBuild(0);
  openEntityPanel(id);   /* land on the new box, ready to price or rename */
}

/* Everything hanging below a node, transitively — so moving a box can take
   whatever it owns along with it instead of stranding it. */
function descendants(st,id,seen){
  seen=seen||{};
  const out=[];
  st.edges.filter(e=>e.from===id).forEach(e=>{
    if(seen[e.to])return;
    seen[e.to]=1;
    const n=st.nodes.find(x=>x.id===e.to);
    if(!n)return;
    out.push(n);
    descendants(st,e.to,seen).forEach(d=>out.push(d));
  });
  return out;
}

/* Two or more entities under the same parent are siblings, not a chain, so
   they belong on one row spread either side of the parent's centre line.
   Stacking them in a single column (which is what happened before) put one
   box directly beneath the other and made the two connectors overlap into
   what looked like a single line passing through the first child. */
function layoutChildren(st,parentId){
  if(!st)return;
  const parent=st.nodes.find(n=>n.id===parentId);if(!parent)return;
  const pd=nodeDim(parent);
  const kids=st.edges.filter(e=>e.from===parentId)
    .map(e=>st.nodes.find(n=>n.id===e.to))
    .filter(n=>n&&n.y>parent.y);
  if(kids.length<2)return;

  /* left-to-right in the order they were attached, so a newly added entity
     appears at the right-hand end rather than being sorted into the middle
     of boxes that were already placed */
  const widths=kids.map(k=>nodeDim(k).w);
  const total=widths.reduce((a,b)=>a+b,0);
  const avail=st.canvasW-4;
  let gap=8;
  if(total+gap*(kids.length-1)>avail){
    gap=Math.max(2,(avail-total)/(kids.length-1));
  }
  const rowW=total+gap*(kids.length-1);
  const pcx=parent.x+pd.w/2;
  let x=Math.max(2,Math.min(st.canvasW-2-rowW,pcx-rowW/2));
  const y=parent.y+pd.h+20;

  kids.forEach((k,i)=>{
    /* shift whatever this child owns by the same amount, so a sub-structure
       travels with the box it belongs to */
    const dx=x-k.x,dy=y-k.y;
    if(dx||dy){
      descendants(st,k.id).forEach(dn=>{dn.x+=dx;dn.y+=dy;});
      k.x=x;k.y=y;
    }
    x+=widths[i]+gap;
  });

  const lowest=st.nodes.reduce((m,n)=>Math.max(m,n.y+nodeDim(n).h),0);
  st.canvasH=Math.max(st.canvasH,lowest+16);
}

/* Recompute which extra entity kinds are present from the diagram itself,
   rather than incrementing a counter — that way removing a box, or removing
   one of two trusts, lands on the right answer without bookkeeping. */
function syncExtraKinds(){
  const st=STATE.struct;
  const kinds=[];
  if(st)st.nodes.forEach(n=>{
    if(n.entKey&&PAGE_KINDS.indexOf(n.entKey)>=0&&kinds.indexOf(n.entKey)<0)kinds.push(n.entKey);
  });
  STATE.extraKinds=kinds;
}

/* Whether this node is one of the numbered company boxes, and if so which
   fee column it owns. Returns null for shareholders, trusts, cells, and
   any box the user added by hand — those fall back to the shared list. */
function feeColIndexForNode(id){
  if(!usesFeeCols())return null;
  const byId=STATE.feeCols.findIndex(c=>c.nodeId===id);
  if(byId>=0)return byId;
  /* older state, or a column built before the diagram was edited — fall
     back to the box's position in the chain */
  const i=companyBoxes().findIndex(n=>n.id===id);
  return (i>=0&&i<STATE.feeCols.length)?i:null;
}
function feeTargetForNode(id,which){
  const ci=feeColIndexForNode(id);
  return ci===null?STATE.fees[which]:STATE.feeCols[ci][which];
}
/* every list a node's fee rows could be sitting in */
function allFeeLists(which){
  return [STATE.fees[which]].concat((STATE.feeCols||[]).map(c=>c[which]));
}
function nodeHasAddon(id,key){
  return ['setup','fixed'].some(which=>
    allFeeLists(which).some(list=>list.some(r=>r._nodeId===id&&r._addon===key)));
}

function toggleEntityAddon(id,key){
  const spec=ENTITY_ADDONS[key];if(!spec)return;
  const on=nodeHasAddon(id,key);
  ['setup','fixed'].forEach(which=>{
    if(on){
      /* remove wherever it ended up, so it still clears if the column
         layout changed since it was added */
      allFeeLists(which).forEach(list=>{
        for(let i=list.length-1;i>=0;i--){
          if(list[i]._nodeId===id&&list[i]._addon===key)list.splice(i,1);
        }
      });
    }else{
      const target=feeTargetForNode(id,which);
      spec[which].forEach(r=>target.push({t:'item',l:r.l,v:r.v,_nodeId:id,_addon:key}));
    }
  });
  renderFeeEditor();
  openEntityPanel(id);      /* repaint the panel's ticks */
  liveBuild(0);
}

function addEntityCustomLine(id){
  const lbl=($('entityCustomLabel')||{}).value||'';
  const which=($('entityCustomWhich')||{}).value||'setup';
  const val=+(($('entityCustomValue')||{}).value||0);
  if(!lbl.trim())return;
  feeTargetForNode(id,which).push({t:'item',l:lbl.trim(),v:val,_nodeId:id,_addon:'custom:'+newStructId()});
  renderFeeEditor();
  openEntityPanel(id);
  liveBuild(0);
}
function removeEntityFeeRow(id,addon){
  ['setup','fixed'].forEach(which=>{
    allFeeLists(which).forEach(list=>{
      for(let i=list.length-1;i>=0;i--){
        if(list[i]._nodeId===id&&list[i]._addon===addon)list.splice(i,1);
      }
    });
  });
  renderFeeEditor();
  openEntityPanel(id);
  liveBuild(0);
}

/* the % on the connector feeding into this node — edited here because
   that's where you'd look for it, though it lives on the edge */
function inboundEdge(id){
  const st=STATE.struct;if(!st)return null;
  return st.edges.find(e=>e.to===id)||null;
}
function setEntityField(id,field,value){
  const st=STATE.struct;if(!st)return;
  const n=st.nodes.find(x=>x.id===id);if(!n)return;
  if(field==='pct'){
    /* A shareholder's holding is shown on the block itself, under the
       name — so it's stored on the node. For everything else the figure
       belongs to the connector coming in. */
    if(n.kind==='shareholder')n.pct=value;
    else{const e=inboundEdge(id);if(e)e.label=value;}
  }else if(field==='label'){
    /* typed newlines become the <br> the box renders with */
    n.label=String(value).replace(/\r?\n/g,'<br>');
  }else{
    n[field]=value;
  }
  renderStructEditorUI();
  liveBuild(0);
}

/* Lay the shareholders out as a centred row at the top, evenly spaced —
   what the decks show when a company is held by several partners. Called
   whenever one is added or removed so the group stays balanced instead of
   drifting left as they accumulate. */
function layoutShareholderRow(st){
  if(!st)return;
  const sh=st.nodes.filter(n=>n.kind==='shareholder');
  if(sh.length<2)return;
  const d=NODE_DIM.shareholder;
  const gap=6;
  const total=sh.length*d.w+(sh.length-1)*gap;
  let x=Math.max(0,(st.canvasW-total)/2);
  const y=Math.min.apply(null,sh.map(n=>n.y));
  sh.sort((a,b)=>a.x-b.x).forEach(n=>{n.x=x;n.y=y;x+=d.w+gap;});
}

function closeEntityPanel(){
  const el=$('entityPanel');if(el)el.remove();
}

function openEntityPanel(id){
  closeEntityPanel();
  const st=STATE.struct;if(!st)return;
  const n=st.nodes.find(x=>x.id===id);if(!n)return;
  const isCompany=feeColIndexForNode(id)!==null||
    /^(ac|gbc)\d*$/.test(id);
  const ci=feeColIndexForNode(id);
  const colNote=ci===null?'':' — charges go to '+STATE.feeCols[ci].label;

  const addonRows=Object.keys(ENTITY_ADDONS).filter(k=>{
    const s=ENTITY_ADDONS[k];
    return !(s.acOnly&&STATE.entities.company!=='ac');
  }).map(k=>{
    const s=ENTITY_ADDONS[k],on=nodeHasAddon(id,k);
    const price=[].concat(s.setup,s.fixed).reduce((a,r)=>a+r.v,0);
    return '<label class="checkline" style="margin:0">'+
      '<input type="checkbox" '+(on?'checked':'')+' onchange="toggleEntityAddon(\''+id+'\',\''+k+'\')">'+
      '<span>'+s.label+'<span class="d">'+s.hint+' · '+curSym()+' '+money(price)+'</span></span></label>';
  }).join('');

  /* anything already charged to this entity, including custom lines */
  const existing=[];
  ['setup','fixed'].forEach(which=>{
    allFeeLists(which).forEach(list=>list.forEach(r=>{
      if(r._nodeId===id&&String(r._addon||'').indexOf('custom:')===0){
        existing.push({which:which,r:r});
      }
    }));
  });
  const customRows=existing.length?'<div style="margin-top:8px">'+existing.map(x=>
    '<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px">'+
    '<span style="flex:1">'+x.r.l+' <em style="opacity:.6">('+(x.which==='setup'?'setup':'annual')+')</em></span>'+
    '<span>'+curSym()+' '+money(x.r.v)+'</span>'+
    '<button type="button" class="ghost" style="width:auto;padding:2px 6px;margin:0" '+
      'onclick="removeEntityFeeRow(\''+id+'\',\''+x.r._addon+'\')">✕</button></div>').join('')+'</div>':'';

  const edge=inboundEdge(id);
  const box=document.createElement('div');
  box.id='entityPanel';
  box.setAttribute('style','position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;'+
    'display:flex;align-items:center;justify-content:center;padding:20px');
  box.innerHTML='<div style="background:#fff;border-radius:10px;padding:20px 22px;width:420px;max-width:100%;'+
      'max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)">'+
    '<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px">'+
      '<div style="flex:1">'+
        '<div style="font-weight:700;font-size:14px;color:#130429">'+n.label.replace(/<br>/g,' ')+'</div>'+
        '<div style="font-size:11px;color:#5A5468;margin-top:2px">'+
          (isCompany?'Company':KIND_LABEL[n.kind]||'Entity')+colNote+'</div>'+
      '</div>'+
      '<button type="button" class="ghost" style="width:auto;padding:3px 8px;margin:0" '+
        'onclick="closeEntityPanel()">✕</button>'+
    '</div>'+

    '<div style="font-size:11px;font-weight:700;color:#130429;margin-bottom:6px">Add to this entity</div>'+
    (addonRows||'<div style="font-size:11px;color:#5A5468">No standard add-ons apply to this box.</div>')+

    '<div style="font-size:11px;font-weight:700;color:#130429;margin:16px 0 2px">Add an entity beneath this one</div>'+
    '<div style="font-size:10.5px;color:#8a8596;margin-bottom:7px">'+
      'Brings its price-book fees with it. Section pages stay under your control in step 1.</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
      ADDABLE_ENTITIES.map(s=>
        '<button type="button" onclick="addEntityUnder(\''+id+'\',\''+s.key+'\')" '+
        'style="width:auto;margin:0;padding:5px 9px;background:#fff;border:1px solid #CDD4DA;'+
        'border-radius:14px;font-family:var(--sans);font-size:10.5px;color:#130429;cursor:pointer" '+
        'onmouseover="this.style.borderColor=\'#B59433\';this.style.color=\'#B59433\'" '+
        'onmouseout="this.style.borderColor=\'#CDD4DA\';this.style.color=\'#130429\'">'+
        '+ '+s.name+'</button>').join('')+
    '</div>'+

    '<div style="font-size:11px;font-weight:700;color:#130429;margin:16px 0 6px">Custom charge</div>'+
    '<div style="display:flex;gap:6px;align-items:center">'+
      '<input id="entityCustomLabel" type="text" placeholder="Description" style="flex:1;min-width:0">'+
      '<select id="entityCustomWhich" style="width:88px"><option value="setup">Setup</option>'+
        '<option value="fixed">Annual</option></select>'+
      '<input id="entityCustomValue" type="number" placeholder="0" style="width:74px">'+
      '<button type="button" class="ghost" style="width:auto;padding:5px 9px;margin:0" '+
        'onclick="addEntityCustomLine(\''+id+'\')">Add</button>'+
    '</div>'+
    customRows+

    '<div style="font-size:11px;font-weight:700;color:#130429;margin:16px 0 6px">This box</div>'+
    /* the stored label carries <br> for the deliberate line break, which
       has no business being visible here — shown as an actual line break
       in a textarea and converted back on the way in */
    '<label class="f" style="margin-bottom:8px"><span>Label '+
      '<span class="hint">line break = new line in the box</span></span>'+
      '<textarea rows="2" style="min-height:0" '+
      'oninput="setEntityField(\''+id+'\',\'label\',this.value)">'+
      n.label.replace(/<br\s*\/?>/gi,'\n')+'</textarea></label>'+
    '<label class="f" style="margin-bottom:8px"><span>Caption under the box</span>'+
      '<input type="text" value="'+(n.cap||'').replace(/"/g,'&quot;')+'" '+
      'placeholder="e.g. Holding Company" oninput="setEntityField(\''+id+'\',\'cap\',this.value)"></label>'+
    (n.kind==='shareholder'
      ? '<label class="f"><span>Holding <span class="hint">shown under the name</span></span>'+
        '<input type="text" value="'+(n.pct||'').replace(/"/g,'&quot;')+'" '+
        'placeholder="e.g. 51%" oninput="setEntityField(\''+id+'\',\'pct\',this.value)"></label>'
      : (edge?'<label class="f"><span>Ownership on the incoming line</span>'+
        '<input type="text" value="'+(edge.label||'').replace(/"/g,'&quot;')+'" '+
        'placeholder="e.g. 100%" oninput="setEntityField(\''+id+'\',\'pct\',this.value)"></label>':''))+

    '<button type="button" style="width:100%;margin-top:16px;padding:9px;border:none;border-radius:7px;'+
      'background:#B59433;color:#130429;font-weight:700;cursor:pointer" '+
      'onclick="closeEntityPanel()">Done</button>'+
  '</div>';
  box.addEventListener('click',function(e){if(e.target===box)closeEntityPanel();});
  document.body.appendChild(box);
}

function addStructEdge(){
  const st=STATE.struct;if(!st||st.nodes.length<2)return;
  st.edges.push({id:newStructId(),from:st.nodes[0].id,to:st.nodes[1].id,label:''});
  renderStructEditorUI();
  redrawStructure();
}

function removeStructEdge(id){
  const st=STATE.struct;if(!st)return;
  st.edges=st.edges.filter(e=>e.id!==id);
  renderStructEditorUI();
  redrawStructure();
}

function resetStructure(){
  /* clear canvas-added entities first, so the spec this reseeds from is the
     plain sidebar selection rather than one still carrying their pages */
  STATE.extraKinds=[];
  closeEntityPanel();
  const p=currentSpec();
  if(!p.structure)return;
  STATE.struct=JSON.parse(JSON.stringify(p.structure));
  /* drop any placeholder fee lines that belonged to custom boxes the
     reset just removed, then re-scale the CIS cell line back to the
     fresh default cell count */
  ['setup','fixed'].forEach(which=>{
    STATE.fees[which]=STATE.fees[which].filter(r=>!r._nodeId);
  });
  syncCellFees();
  renderSectionToggles(true);
  renderStructEditorUI();
  renderFeeEditor();
  redrawStructure();
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   RENDERER
   ═══════════════════════════════════════════════════════════════ */
let PAGENO=0,RUNNING='',PAGES=[];

/* ── image slots ───────────────────────────────────────────────
   Real photography sits on top of a tonal gradient. A missing file
   just falls back to the gradient — never a broken-image icon.
   Run DOUBLE-CLICK-TO-EXTRACT-IMAGES.bat to populate assets/.      */
const ASSET_DIR='assets/';
const GRAD_DARK ="linear-gradient(150deg,#3E2436 0%,#241028 55%,#160A1C 100%)";
const GRAD_LIGHT="linear-gradient(150deg,#DDE3E7 0%,#C6CFD6 100%)";

function slot(name,label,o){
  o=o||{};
  let cls='imgslot'+(o.light?' light':'')+(o.contain?' contain':'')+(o.cls?' '+o.cls:'');
  let st=o.style||'';
  if(name){
    st += o.contain
      ? "background-image:url('"+ASSET_DIR+name+".png');"
      : "background-image:url('"+ASSET_DIR+name+".png'),"+(o.light?GRAD_LIGHT:GRAD_DARK)+";";
  }
  return '<div class="'+cls+'" data-slot="'+(label||'')+'" style="'+st+'">'+(o.inner||'')+'</div>';
}

/* which leaf-wheel graphic belongs to which service page */
const LEAF_IMG={board:'leaf-board',accounting:'leaf-accounting',legal:'leaf-legal',
  compliance:'leaf-compliance',it:'leaf-it',concierge:'leaf-concierge',media:'leaf-plain'};

/* Reliable gold rosette — a hand-built SVG, not an emoji glyph. Browsers
   render "❀" inconsistently (that red-outline circle you saw is Chrome's
   fallback box for a font that lacks the glyph). currentColor lets CSS set
   the fill. */
function ornamentSVG(size){
  size=size||'1em';
  return '<svg viewBox="0 0 32 32" width="'+size+'" height="'+size+
    '" style="display:inline-block;vertical-align:-0.12em" aria-hidden="true">'+
    '<g fill="currentColor">'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(0 16 16)"/>'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(45 16 16)"/>'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(90 16 16)"/>'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(135 16 16)"/>'+
    '<circle cx="16" cy="16" r="2.6" fill="#fff" fill-opacity=".35"/>'+
    '</g></svg>';
}

/* Larger, more detailed gold rosette used only on the "Our Group" page —
   two rings (outer dot ring + petal ring) plus a bordered inner disc, closer
   in spirit to the mandala on the source page without trying to trace it
   pixel-for-pixel (that artwork is vector-only in the source PDF and not
   recoverable as an asset). */
function mandalaSVG(size){
  size=size||'26mm';
  let petals='';
  const n=16;
  for(let i=0;i<n;i++){
    const ang=i*(360/n);
    petals+='<ellipse cx="50" cy="27" rx="4" ry="12" transform="rotate('+ang+' 50 50)" fill="currentColor" fill-opacity=".82"/>';
  }
  let dots='';
  const dn=28;
  for(let i=0;i<dn;i++){
    const ang=i*(360/dn)*Math.PI/180;
    const cx=50+43*Math.cos(ang), cy=50+43*Math.sin(ang);
    dots+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="1.5" fill="currentColor"/>';
  }
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+
    '" style="display:block;margin:0 auto;color:var(--gold)" aria-hidden="true">'+
    '<g>'+dots+petals+
    '<circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="1.1"/>'+
    '<circle cx="50" cy="50" r="6.5" fill="currentColor"/>'+
    '</g></svg>';
}

/* Gold "bracket" rule used to underline a category header spanning one or
   more columns — a horizontal hairline with short vertical ticks turning
   down at each end. Stretches to fill its flex container (non-uniform
   scaling via preserveAspectRatio="none"), stroke width held constant via
   vector-effect. */
function bracketSVG(){
  return '<svg viewBox="0 0 100 10" preserveAspectRatio="none" '+
    'style="display:block;width:100%;height:3mm" aria-hidden="true">'+
    '<path d="M2 2 L2 8 M2 2 L98 2 M98 2 L98 8" stroke="#B59433" stroke-width="1.4" '+
    'fill="none" vector-effect="non-scaling-stroke"/></svg>';
}

/* Small inline flag icons — simple, print-safe, no external font/image
   dependency. Approximations of the national flags, sized for a caption row. */
function flagSVG(country){
  const common='style="display:inline-block;vertical-align:-1px;margin-right:1.2mm;border:.25px solid #00000022"';
  if(country==='Mauritius'){
    return '<svg width="4.6mm" height="3mm" viewBox="0 0 30 20" '+common+'>'+
      '<rect width="30" height="5" y="0" fill="#EA2839"/>'+
      '<rect width="30" height="5" y="5" fill="#1A206D"/>'+
      '<rect width="30" height="5" y="10" fill="#FFD500"/>'+
      '<rect width="30" height="5" y="15" fill="#00A551"/></svg>';
  }
  if(country==='United Arab Emirates'){
    return '<svg width="4.6mm" height="3mm" viewBox="0 0 30 20" '+common+'>'+
      '<rect width="30" height="6.67" y="0" fill="#00843D"/>'+
      '<rect width="30" height="6.67" y="6.67" fill="#FFFFFF"/>'+
      '<rect width="30" height="6.66" y="13.34" fill="#000000"/>'+
      '<rect width="9" height="20" fill="#EF3340"/></svg>';
  }
  if(country==='Canada'){
    return '<svg width="4.6mm" height="3mm" viewBox="0 0 30 20" '+common+'>'+
      '<rect width="30" height="20" fill="#FFFFFF"/>'+
      '<rect width="7.5" height="20" x="0" fill="#FF0000"/>'+
      '<rect width="7.5" height="20" x="22.5" fill="#FF0000"/>'+
      '<path d="M15 4l1 3 2.5-1.4-.8 2.6 2.3.2-1.8 1.8 1.2 1-2 .3.3 1.8-1.7-.9-.2 2h-2l-.2-2-1.7.9.3-1.8-2-.3 1.2-1-1.8-1.8 2.3-.2-.8-2.6L14 7z" fill="#FF0000"/></svg>';
  }
  return '';
}

/* Groups BP.ourGroupEntities into category clusters, reading the same
   {cat:'X',...},{cat:'',...},{cat:'',...} convention already used in the
   data (a non-empty cat starts a new group; an empty cat continues the
   previous one). */
function groupByCategory(entities){
  const groups=[];
  entities.forEach(e=>{
    if(e.cat){groups.push({cat:e.cat,items:[e]});}
    else if(groups.length){groups[groups.length-1].items.push(e);}
    else{groups.push({cat:'',items:[e]});}
  });
  return groups;
}

/* The utility "crest" badge repeated in the corner of every content page.
   White pages use the full-colour lockup (navy wordmark); dark/photo pages
   use the white-gradient SVG, which has a white wordmark and a gold
   gradient emblem so it sits directly on the artwork. Earlier versions had
   to put a white chip behind the full-colour logo on dark pages to keep the
   navy wordmark legible — that chip is no longer needed and has been
   removed everywhere the white logo is used. */
/* The two logo files have DIFFERENT amounts of built-in whitespace around
   the artwork, so the same top/right/height would place them differently.
   Measured against the source PDF (see the sizing note on logoImgWhite):
     logo-white.svg       content = 80.07% of width, 63.26% of height,
                          inset 9.93% from left, 18.37% from top
     logo-full-color.png  content = 100% of width, 93.26% of height,
                          inset 0% from left, 3.95% from top
   The offsets below are back-calculated from where the crest actually sits
   on the source pages (content 17.6-17.9mm wide, ~11.7mm from the top,
   ~264.3mm from the left) so both variants land in the same visual spot. */
function crest(dark){
  const pos=dark?'top:8.27mm;right:12.89mm':'top:11.15mm;right:14.83mm';
  return '<div class="crest" style="'+pos+'">'+
    (dark?logoImgWhite('19.23mm'):logoImg('13.24mm'))+'</div>';
}

/* White-on-dark variant of the lockup. Self-contained SVG (white vector
   wordmark + embedded gold-gradient emblem), so it needs no chip behind it
   the way the navy-wordmark PNG did.

   Sizing note: this artwork carries a wide transparent margin — the visible
   logo is only 80.07% of the file's width and 63.26% of its height — so the
   height passed in here is always noticeably larger than the logo appears.
   Callers pass a height derived from the measured on-page size in the
   source deck rather than the apparent size, and max-width is released
   because the cover lockup is wider than the 32mm .logoimg cap. */
function logoImgWhite(height){
  return '<img class="logoimg" style="height:'+height+';max-width:none;display:block" '+
    'src="'+ASSET_DIR+'logo-white.svg" '+
    'onerror="logoFallbackWhite(this)">';
}

/* Dark-page fallback, kept separate from logoFallback() on purpose.
   The only substitute available is the full-colour PNG, whose wordmark is
   near-black — dropped straight onto a plum page or a night photograph it
   reads as "the logo is broken/missing" rather than as a fallback, which is
   exactly what happens when logo-white.svg hasn't been deployed alongside
   the HTML. So when we fall back here we also restore the white chip the
   navy wordmark needs, trading exact fidelity for something legible. */
function logoFallbackWhite(img){
  img.onerror=null;
  img.src=ASSET_DIR+'logo-full-color.png';
  img.style.background='#fff';
  img.style.borderRadius='2mm';
  img.style.padding='1.4mm 2.2mm';
  /* the chip's padding would otherwise push the lockup past its measured
     size, so shrink the image itself to compensate */
  img.style.height=(parseFloat(img.style.height)*0.62)+'mm';
}

/* Real logo, with a fallback chain so it works whether or not the
   extractor has been run and wherever the file currently lives:
     1) assets/logo-full-color.png   (written by the extractor)
     2) ../logo.png.png              (the file already in your workspace)
     3) CSS text lockup              (always works, no image needed)
   onerror walks this chain once, then gives up gracefully. */
function logoImg(height){
  const id='logo'+(Math.random()*1e9|0);
  return '<img id="'+id+'" class="logoimg" style="height:'+height+';display:block" '+
    'src="'+ASSET_DIR+'logo-full-color.png" '+
    'data-fallback="../logo.png.png" '+
    'onerror="logoFallback(this)">';
}
function logoFallback(img){
  const next=img.getAttribute('data-fallback');
  if(next){
    img.removeAttribute('data-fallback');
    img.src=next;
  }else{
    /* both image paths failed — swap in the text lockup so nothing looks broken */
    const span=document.createElement('span');
    span.innerHTML='<span style="font-family:var(--serif);font-size:11pt;color:var(--navy);'+
      'line-height:1;display:inline-flex;align-items:center;gap:2px">'+
      '<span style="color:var(--gold)">'+ornamentSVG('10pt')+'</span>aurevya</span>';
    img.replaceWith(span.firstChild);
  }
}
function foot(){
  PAGENO++;
  return '<div class="pfoot"><span class="l">AUREVYA WEALTH</span>'+
    '<span class="c">'+RUNNING+'</span>'+
    '<span class="r">A KUNDOMAL &amp; CO ENTERPRISE</span><span class="n">'+PAGENO+'</span></div>';
}
function page(inner,cls){
  return '<div class="page '+(cls||'')+'">'+inner+'</div>';
}

/* ── individual page builders ─────────────────────────── */
function pgCover(p,d){
  return page('<div class="cover">'+
    slot('cover-photograph','cover photograph',{cls:'art',inner:'<div class="tag">'+BP.tagline+'</div>'})+
    '<div class="pane">'+
      /* 50.02mm renders the visible lockup at the 45.8 x 31.0mm it measures
         on the source cover (the file's own transparent margin accounts for
         the rest) — see the sizing note on logoImgWhite. */
      '<div class="mark">'+logoImgWhite('50.02mm')+'</div>'+
      '<div class="t1">'+p.coverT1+'</div><div class="t2">'+p.coverT2+'</div>'+
      (p.coverT3?'<div class="t1" style="font-size:10pt;margin-top:1mm">'+p.coverT3+'</div>':'')+
      '<div class="rule"></div>'+
      '<div class="pf">Prepared for</div><div class="cn">'+(d.client||'—')+'</div>'+
      '<div class="dt">'+d.month+'&nbsp; '+d.year+'</div>'+
      '<div class="ent">'+BP.enterprise+'</div>'+
    '</div></div>','nofoot');
}

function pgDisclaimer(){
  return page(crest()+'<div class="pbody" style="background:var(--paper-alt)">'+
    '<div class="disclaimerbox"><h4>Disclaimer</h4><div class="dc">'+
    BP.disclaimer.map(t=>'<p>'+t+'</p>').join('')+
    '</div></div>'+foot()+'</div>');
}

function pgContents(toc){
  return page('<div class="contents">'+
    slot('contents-photograph','contents photograph')+
    '<div class="list">'+crest()+'<h1 class="ptitle">Contents</h1>'+
    '<div class="toc">'+toc.map(t=>'<div class="ti"><span class="tt">'+t[0]+'</span><span class="tn">'+t[1]+'</span></div>').join('')+'</div>'+
    foot()+'</div></div>');
}

function pgGlossary(terms){
  const per=Math.ceil(terms.length/4);
  let cols='';
  for(let i=0;i<4;i++){
    cols+='<div class="col">'+terms.slice(i*per,(i+1)*per).map(t=>
      '<div class="term">'+t[0]+'</div><div class="def">'+t[1]+'</div>').join('')+'</div>';
  }
  return page(crest()+'<div class="pbody"><h1 class="ptitle">Glossary <em>of Terms</em></h1>'+
    '<div class="cols c4">'+cols+'</div>'+foot()+'</div>');
}

function pgOurGroup(){
  /* Subsidiary logos are vector artwork in the source PDFs, not embedded
     raster images — there is nothing for the extractor to pull out for
     these. Each card looks for assets/logo-<slug>.png (see README for the
     exact filenames) and falls back to a clean gold-rule+name typographic
     treatment if the file hasn't been supplied yet, so nothing ever looks
     broken either way. */
  const groups=groupByCategory(BP.ourGroupEntities);
  const brackets=groups.map(g=>
    '<div style="flex:'+g.items.length+' 1 0;text-align:center;padding:0 2mm">'+
      bracketSVG()+
      '<div style="font-family:var(--serif);font-style:italic;font-size:7.6pt;'+
        'letter-spacing:.03em;color:var(--navy);margin-top:1.3mm">'+g.cat+'</div>'+
    '</div>').join('');
  /* Every card reserves the same band height — the tallest logo's — so the
     names below stay on one line across the row even though the marks
     themselves are now different sizes. */
  const LOGO_BASE=14;
  const maxScale=BP.ourGroupEntities.reduce((m,e)=>Math.max(m,e.logoScale||1),1);
  const bandH=+(LOGO_BASE*maxScale).toFixed(2);

  const cards=BP.ourGroupEntities.map(e=>{
    const logoSrc=ASSET_DIR+'logo-'+(e.logo==='aurevya'?'full-color':e.logo)+'.png';
    const sc=e.logoScale||1;
    const mh=+(LOGO_BASE*sc).toFixed(2);
    const mw=Math.min(100,Math.round(92*sc));
    const logoHTML='<div style="height:'+bandH+'mm;display:flex;align-items:center;justify-content:center;margin-bottom:3mm">'+
      '<img src="'+logoSrc+'" style="max-height:'+mh+'mm;max-width:'+mw+'%;object-fit:contain" '+
      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'+
      '<div style="display:none;width:16mm;height:.8px;background:var(--gold)"></div></div>';
    return '<div class="col" style="display:flex;flex-direction:column;">'+
    logoHTML+
    '<div class="term" style="text-align:center;font-family:var(--serif);font-size:8.4pt">'+e.name+'</div>'+
    '<p style="font-size:6.6pt;text-align:center">'+e.txt+'</p>'+
    (e.partner?(
      '<div style="text-align:center;margin-top:1.5mm">'+
      '<p style="font-size:6.2pt;color:var(--navy);margin:0 0 1mm">'+e.partner+'</p>'+
      '<img src="'+ASSET_DIR+'logo-'+(e.partnerLogo||'nec')+'.png" style="max-height:5mm;max-width:60%;object-fit:contain" '+
      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline\'">'+
      '<span style="display:none;font-family:var(--serif);font-size:7.5pt;letter-spacing:.1em;color:var(--navy)">NEC</span>'+
      '</div>'
    ):'')+
    /* "Operating in" + flags pinned to the bottom of the card via
       margin-top:auto — .cols is a CSS grid, so every card in the same
       row is already stretched to the same height; without this, cards

/* absolutely-positioned node boxes — see NODE_DIM/KIND_LABEL above */
/* How far right to push a box's caption so the outgoing connector doesn't
   run through it — 0 when nothing leaves the box. Shared with the drag
   handler, which repositions the caption live and has to agree. */
function capOffset(st,n){
  if(!st||!n.cap)return 0;
  const d=nodeDim(n);
  const leaves=st.edges.some(e=>{
    if(e.from!==n.id)return false;
    const t=st.nodes.find(x=>x.id===e.to);
    return t&&t.y>n.y;          /* only lines heading downward matter */
  });
  return leaves?(d.w/2+3):0;
}

function renderNodesHTML(st){
  return st.nodes.map(n=>{
    const d=nodeDim(n);
    const base='position:absolute;left:'+n.x+'mm;top:'+n.y+'mm;width:'+d.w+'mm;height:'+d.h+'mm;cursor:grab;';
    let out;
    if(n.kind==='shareholder'){
      out='<div class="dragnode shnode" data-nid="'+n.id+'" style="'+base+
        'justify-content:flex-start;" '+
        'title="Click to set the holding or rename — drag to move">'+
        '<div class="personicon" style="margin-bottom:1.6mm">'+PERSON_GLYPH+'</div>'+
        '<div class="shname">'+shName(n.label)+'</div>'+
        (n.pct?'<div class="shrule"></div><div class="shpct">'+n.pct+'</div>':'')+
        '</div>';
    }else{
      const cls='dragnode node'+(n.kind==='ciscell'?' cell':'')+(n.primary?' filled':'');
      out='<div class="'+cls+'" data-nid="'+n.id+'" style="'+base+'" '+
        'title="Click to add services or edit this entity — drag to move">'+n.label+'</div>';
    }
    if(n.cap){
      /* A box with a connector leaving its bottom edge would have that line
         drawn straight through a centred caption, so the caption shifts
         clear of it. Boxes at the end of a chain keep it centred. */
      const off=capOffset(st,n);
      out+='<div class="nodecap" data-cap-for="'+n.id+'" style="position:absolute;left:'+
        (n.x+off)+'mm;top:'+(n.y+d.h+1.5)+'mm;width:'+d.w+'mm;'+
        'text-align:'+(off?'left':'center')+';margin:0">'+n.cap+'</div>';
    }
    /* delete badge on every box — routed through removeAnyNode(), which
       knows to unwind Section 1 + fees first for the four core boxes */
    if(st.nodes.length>1){
      out+='<button type="button" class="nodeDelBtn noprint" title="Remove" '+
        'style="left:'+(n.x+d.w-2.6)+'mm;top:'+(n.y-2.6)+'mm" '+
        'onclick="removeAnyNode(\''+n.id+'\')">✕</button>';
    }
    return out;
  }).join('');
}

/* point where a line from a box's centre toward (tx,ty) crosses the
   box's own boundary — used so connectors leave from whichever edge
   actually faces the other node, not always dead-centre top/bottom */
function edgeAnchor(cx,cy,w,h,tx,ty){
  const dx=tx-cx,dy=ty-cy;
  if(dx===0&&dy===0)return{x:cx,y:cy};
  const hw=w/2,hh=h/2;
  const scaleX=dx!==0?hw/Math.abs(dx):Infinity;
  const scaleY=dy!==0?hh/Math.abs(dy):Infinity;
  const scale=Math.min(scaleX,scaleY);
  return{x:cx+dx*scale,y:cy+dy*scale};
}

/* connector lines drawn in an SVG overlay, in the same mm coordinate
   space as the nodes — recomputed on every drag frame, so the lines
   always follow whatever box just moved */
function renderEdgesSVG(st){
  const byId={};st.nodes.forEach(n=>byId[n.id]=n);
  let svg='<svg class="edgesvg" viewBox="0 0 '+st.canvasW+' '+st.canvasH+'" '+
    'style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" xmlns="http://www.w3.org/2000/svg">';

  /* Two or more shareholders feeding the same entity are drawn as one
     bus — a stub down from each, a horizontal line joining them, and a
     single arrow into the company — rather than separate diagonals
     converging on the box, which is how the manual decks show it. Their
     percentages sit on the shareholder blocks themselves, so these edges
     carry no label. */
  const shGroups={};
  st.edges.forEach(e=>{
    const a=byId[e.from],b=byId[e.to];
    if(a&&b&&a.kind==='shareholder')(shGroups[e.to]=shGroups[e.to]||[]).push(e);
  });
  const bussed=Object.keys(shGroups).filter(k=>shGroups[k].length>1);
  const busEdgeIds={};
  bussed.forEach(t=>shGroups[t].forEach(e=>{busEdgeIds[e.id]=true;}));

  bussed.forEach(t=>{
    const b=byId[t];const db=nodeDim(b);
    const srcs=shGroups[t].map(e=>byId[e.from]);
    /* per-node, since a shareholder showing a percentage is taller than one
       that isn't — measuring them all with the same nominal height left the
       stubs starting short of the block */
    const xs=srcs.map(s=>s.x+nodeDim(s).w/2);
    const bottom=Math.max.apply(null,srcs.map(s=>s.y+nodeDim(s).h));
    const bcx=b.x+db.w/2;
    /* sit the joining line midway between the lowest shareholder and the
       top of the box, so it never collides with either */
    let busY=bottom+(b.y-bottom)/2;
    if(!(busY>bottom+1))busY=bottom+1;
    if(busY>b.y-2)busY=Math.max(bottom+1,b.y-2);
    /* each stub leaves its own block's bottom edge — the blocks aren't
       necessarily the same height (a name that wraps makes one taller), and
       starting them all at the lowest edge left a gap under the shorter
       ones */
    srcs.forEach((s,i)=>{
      svg+='<line x1="'+xs[i]+'" y1="'+(s.y+nodeDim(s).h)+'" x2="'+xs[i]+'" y2="'+busY+
        '" stroke="#130429" stroke-width=".35"/>';
    });
    svg+='<line x1="'+Math.min.apply(null,xs)+'" y1="'+busY+'" x2="'+Math.max.apply(null,xs)+'" y2="'+busY+
      '" stroke="#130429" stroke-width=".35"/>';
    const arrowLen=2.6,arrowW=1.3,tipY=b.y;
    svg+='<line x1="'+bcx+'" y1="'+busY+'" x2="'+bcx+'" y2="'+(tipY-arrowLen)+'" stroke="#130429" stroke-width=".35"/>';
    svg+='<polygon points="'+bcx+','+tipY+' '+(bcx+arrowW)+','+(tipY-arrowLen)+' '+
      (bcx-arrowW)+','+(tipY-arrowLen)+'" fill="#130429"/>';
  });

  /* The mirror of the bus: one entity holding several below it fans out —
     a stub down from the parent, a horizontal line spanning the children,
     then a drop with an arrow into each. Drawn as a group so the branches
     share one trunk rather than overlapping into what looks like a chain. */
  const fanGroups={};
  st.edges.forEach(e=>{
    if(busEdgeIds[e.id])return;
    const a=byId[e.from],b=byId[e.to];
    if(a&&b&&b.y>a.y&&a.kind!=='shareholder')(fanGroups[e.from]=fanGroups[e.from]||[]).push(e);
  });
  const fanned=Object.keys(fanGroups).filter(k=>fanGroups[k].length>1);
  fanned.forEach(pid=>{
    const a=byId[pid];const da=nodeDim(a);
    const kids=fanGroups[pid].map(e=>({e:e,n:byId[e.to]}));
    const acx=a.x+da.w/2,aBottom=a.y+da.h;
    const topKid=Math.min.apply(null,kids.map(k=>k.n.y));
    let fanY=aBottom+(topKid-aBottom)/2;
    if(!(fanY>aBottom+1))fanY=aBottom+1;
    if(fanY>topKid-2)fanY=Math.max(aBottom+1,topKid-2);
    const xs=kids.map(k=>k.n.x+nodeDim(k.n).w/2);
    /* trunk */
    svg+='<line x1="'+acx+'" y1="'+aBottom+'" x2="'+acx+'" y2="'+fanY+'" stroke="#130429" stroke-width=".35"/>';
    /* spanning line, stretched to include the trunk so it always connects */
    svg+='<line x1="'+Math.min(acx,Math.min.apply(null,xs))+'" y1="'+fanY+
      '" x2="'+Math.max(acx,Math.max.apply(null,xs))+'" y2="'+fanY+'" stroke="#130429" stroke-width=".35"/>';
    const arrowLen=2.6,arrowW=1.3;
    kids.forEach((k,i)=>{
      const cx=xs[i],tipY=k.n.y;
      svg+='<line x1="'+cx+'" y1="'+fanY+'" x2="'+cx+'" y2="'+(tipY-arrowLen)+'" stroke="#130429" stroke-width=".35"/>';
      svg+='<polygon points="'+cx+','+tipY+' '+(cx+arrowW)+','+(tipY-arrowLen)+' '+
        (cx-arrowW)+','+(tipY-arrowLen)+'" fill="#130429"/>';
      if(k.e.label){
        svg+='<text x="'+(cx+3.5)+'" y="'+((fanY+tipY)/2)+'" font-family="Cormorant Garamond, serif" '+
          'font-style="italic" font-size="4.6" fill="#B59433">'+k.e.label+'</text>';
      }
      busEdgeIds[k.e.id]=true;   /* don't redraw it below */
    });
  });

  st.edges.forEach(e=>{
    if(busEdgeIds[e.id])return;   /* drawn as part of a bus or fan above */
    const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
    const da=nodeDim(a),db=nodeDim(b);
    /* connect from whichever side of each box faces the other node, so
       edges between boxes that aren't stacked directly on top of each
       other (e.g. a shareholder feeding in from the side) don't cut
       through the box corners */
    const acx=a.x+da.w/2,acy=a.y+da.h/2,bcx=b.x+db.w/2,bcy=b.y+db.h/2;
    const p1=edgeAnchor(acx,acy,da.w,da.h,bcx,bcy);
    const p2=edgeAnchor(bcx,bcy,db.w,db.h,acx,acy);
    const angle=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    const arrowLen=2.6,arrowW=1.3;
    const tipX=p2.x,tipY=p2.y;
    const backX=tipX-arrowLen*Math.cos(angle),backY=tipY-arrowLen*Math.sin(angle);
    const perpX=Math.sin(angle)*arrowW,perpY=-Math.cos(angle)*arrowW;
    svg+='<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+backX+'" y2="'+backY+'" stroke="#130429" stroke-width=".35"/>';
    svg+='<polygon points="'+tipX+','+tipY+' '+(backX+perpX)+','+(backY+perpY)+' '+(backX-perpX)+','+(backY-perpY)+'" fill="#130429"/>';
    if(e.label){
      const mx=(p1.x+p2.x)/2+3.5,my=(p1.y+p2.y)/2;
      svg+='<text x="'+mx+'" y="'+my+'" font-family="Cormorant Garamond, serif" font-style="italic" '+
        'font-size="4.6" fill="#B59433">'+e.label+'</text>';
    }
  });
  svg+='</svg>';
  return svg;
}

/* Usable area inside .structpage .rp: the panel is 68% of the 297mm page
   less its 12mm side and 14mm top/bottom padding, with a little more taken
   off the bottom for the running footer. */
const STRUCT_FIT={w:176,h:150};

/* How tall the chart actually is, and how much to scale it by to fit.
   Width is measured against the logical canvas rather than the content
   bounding box, so horizontal centring stays as laid out. */
function structFit(st){
  let bottom=0;
  (st.nodes||[]).forEach(n=>{
    const d=nodeDim(n);
    bottom=Math.max(bottom,n.y+d.h+(n.cap?6:0));
  });
  const h=Math.max(40,bottom+4);
  const k=Math.min(1,STRUCT_FIT.w/Math.max(1,st.canvasW),STRUCT_FIT.h/h);
  return{k:k,h:h};
}

function pgStructure(st){
  const ent=STATE.entities||{};
  const isStructMode=STATE.mode==='structure';
  let toolbar='<div class="structToolbar noprint">'+
    '<button type="button" class="structAddBtn" title="Add a shareholder box" onclick="addStructNode(\'shareholder\')">'+
      '<span class="plus">+</span>Shareholder</button>'+
    '<button type="button" class="structAddBtn" title="Add a generic entity box" onclick="addStructNode(\'box\')">'+
      '<span class="plus">+</span>Entity</button>';
  if(isStructMode&&!ent.trust){
    toolbar+='<button type="button" class="structAddBtn" title="Add a Trust — brings in the Trust pages, glossary terms and fees" onclick="addCoreEntity(\'trust\')">'+
      '<span class="plus">+</span>Trust</button>';
  }
  if(isStructMode&&!ent.cis){
    toolbar+='<button type="button" class="structAddBtn" title="Add a CIS (PCC) — brings in the CIS pages, glossary terms and fees" onclick="addCoreEntity(\'cis\')">'+
      '<span class="plus">+</span>CIS</button>';
  }
  if(isStructMode&&ent.cis){
    toolbar+='<button type="button" class="structAddBtn" title="Add a CIS cell" onclick="addStructNode(\'ciscell\')">'+
      '<span class="plus">+</span>Cell</button>';
  }
  toolbar+='</div>';

  /* Shrink the diagram to fit the page when it outgrows the panel. A deep
     structure can easily run past 158mm of usable height, and the page
     clips rather than scrolls, so the bottom of the chart simply vanished.
     Scaling the whole canvas keeps the proportions and the connector
     geometry intact — nothing needs to know it happened, because the node
     coordinates stay in their own logical mm space. */
  const fit=structFit(st);
  /* the logical mm dimensions travel with the element, so the drag handler
     can convert pixels to mm without having to know the scale factor */
  const canvas='<div class="freecanvas" data-cw="'+st.canvasW+'" data-ch="'+fit.h+'" '+
    'style="position:relative;width:'+st.canvasW+'mm;height:'+
    fit.h+'mm;margin:0 auto'+
    (fit.k<1?';transform:scale('+fit.k.toFixed(4)+');transform-origin:top center':'')+'">'+
    renderEdgesSVG(st)+renderNodesHTML(st)+'</div>';
  /* the toolbar sits outside the scaled element so the buttons stay a
     usable size however far the chart has been shrunk */
  let inner='<div class="structfit" style="position:relative;width:100%;height:'+
    (fit.k<1?Math.round(fit.h*fit.k):fit.h)+'mm">'+toolbar+canvas+'</div>';
  if(st.note)inner+='<div class="dgnote">Note: '+st.note+'</div>';
  return page('<div class="structpage">'+
    '<div class="lp"><h2>'+st.title+'</h2>'+(st.sub?'<div class="ss">'+st.sub+'</div>':'')+
      slot('structure-portrait','portrait',{style:'position:absolute;left:0;right:0;bottom:0;height:58%;'})+
      '<div class="aw">AUREVYA WEALTH</div></div>'+
    '<div class="rp">'+crest()+inner+foot()+'</div></div>');
}

/* ── fee table layout ──────────────────────────────────────────────
   A quote for a single entity is short enough for one narrow column, but
   a Trust + AC + CIS + Nominee structure runs to roughly twice the height
   of the page — which used to just clip, taking the TOTAL row with it.
   So the rows are grouped into blocks (a gold group heading plus the
   items underneath it), measured, and if the stack won't fit they're
   balanced across two columns on the same page with a full-width TOTAL
   bar underneath. The total is always the last thing laid out, so it can
   never be the row that falls off the page.
   ────────────────────────────────────────────────────────────────── */

/* Split the flat fee-row list into blocks so a group heading is never
   separated from the items it introduces. */
function feeBlocks(rows){
  const blocks=[];let cur=null,pend=[];
  const flush=()=>{if(cur&&(cur.grp||cur.items.length))blocks.push(cur);};
  rows.forEach(r=>{
    if(r.t==='grp'){flush();cur={grp:r.l,items:[]};pend=[];}
    /* 'sub' is an indented bullet beneath the preceding line — the Trust
       decks break a priced item down into numbered sub-headings each with
       their own bullets, which a flat desc list can't express. Carried
       through as {sub:true} so feeBlockHTML can indent it. */
    else if(r.t==='sub'){pend.push({sub:true,l:r.l});}
    else if(r.t==='desc'){pend.push({sub:false,l:r.l});}
    else{
      if(!cur)cur={grp:null,items:[]};
      cur.items.push({lines:pend.concat([{sub:false,l:r.l}]),v:r.v});pend=[];
    }
  });
  flush();
  return blocks;
}

/* Rough height in mm, from the padding/line-height in the .deckfee rules
   above. It only has to be good enough to pick one column vs two and to
   balance them — nothing depends on it being exact. */
const FEE_H={grp:7.1,rowPad:2.2,line:2.7,header:7.8,total:7.4,avail:112};
function feeBlockHeight(b){
  return (b.grp?FEE_H.grp:0)+
    b.items.reduce((h,it)=>h+FEE_H.rowPad+it.lines.length*FEE_H.line,0);
}

function feeBlockHTML(b){
  let out=b.grp?'<tr class="grp"><td colspan="2">'+b.grp+'</td></tr>':'';
  b.items.forEach(it=>{
    out+='<tr class="rule"><td>'+it.lines.map(l=>
      l.sub?'<div class="feesub">'+l.l+'</div>':'<div>'+l.l+'</div>').join('')+'</td>'+
      '<td class="r" style="vertical-align:middle">'+money(it.v)+'</td></tr>';
  });
  return out;
}

function pgFee(which,d){
  const rows=STATE.fees[which];const tot=feeTotal(which);
  const title=which==='setup'?'Setup Fee':'Fixed Fee';
  const sub=which==='setup'?'(One Off)':'(Year One Onwards)';
  const cur='PRICE ('+(d.currency==='EUR'?'EUR':'US$')+')';
  const head='<thead><tr><th>DESCRIPTIONS</th><th class="r">'+cur+'</th></tr></thead>';

  /* Per-entity columns: one table per company, each headed with that
     entity's name and closed with its own TOTAL, exactly as the source
     decks lay it out. Shared blocks (trust/CIS) sit above, full width.
     This is a different thing from the overflow balancing below — here the
     split is semantic, so it applies however short the columns are. */
  if(usesFeeCols()){
    const colHead=lbl=>'<thead><tr><th>DESCRIPTIONS ('+lbl+')</th>'+
      '<th class="r">'+cur+'</th></tr></thead>';
    const sharedBlocks=feeBlocks(rows);
    const perCol=STATE.feeCols.map(c=>{
      const b=feeBlocks(c[which]);
      return '<table class="deckfee">'+colHead(c.label)+'<tbody>'+
        b.map(feeBlockHTML).join('')+
        '<tr class="tot"><td>TOTAL '+c.label+'</td>'+
        '<td class="r">'+money(rowsTotal(c[which]))+'</td></tr>'+
        '</tbody></table>';
    }).join('');
    const inner='<div class="feewrap wide">'+
      (sharedBlocks.length?'<table class="deckfee">'+head+'<tbody>'+
        sharedBlocks.map(feeBlockHTML).join('')+'</tbody></table>':'')+
      '<div class="feecols cols'+STATE.feeCols.length+'">'+perCol+'</div>'+
      '<table class="deckfee feetotal"><tbody>'+
        '<tr class="tot"><td>TOTAL</td><td class="r">'+money(tot)+'</td></tr>'+
      '</tbody></table></div>';
    return feePage(title,sub,inner);
  }

  const blocks=feeBlocks(rows);
  const heights=blocks.map(feeBlockHeight);
  const stack=heights.reduce((a,b)=>a+b,0);

  let inner;
  if(stack+FEE_H.header+FEE_H.total<=FEE_H.avail){
    /* short quote — keep the original single narrow column */
    inner='<div class="feewrap"><table class="deckfee">'+head+'<tbody>'+
      blocks.map(feeBlockHTML).join('')+
      '<tr class="tot"><td>TOTAL</td><td class="r">'+money(tot)+'</td></tr>'+
      '</tbody></table></div>';
  }else{
    /* long quote — split across two columns at the point that leaves the
       two sides closest in height, so neither runs far past the other */
    let best=1,bestDiff=Infinity,run=0;
    for(let i=1;i<blocks.length;i++){
      run+=heights[i-1];
      const diff=Math.abs(run-(stack-run));
      if(diff<bestDiff){bestDiff=diff;best=i;}
    }
    const col=(from,to)=>'<table class="deckfee">'+head+'<tbody>'+
      blocks.slice(from,to).map(feeBlockHTML).join('')+'</tbody></table>';
    inner='<div class="feewrap wide">'+
      '<div class="feecols">'+col(0,best)+col(best,blocks.length)+'</div>'+
      '<table class="deckfee feetotal"><tbody>'+
        '<tr class="tot"><td>TOTAL</td><td class="r">'+money(tot)+'</td></tr>'+
      '</tbody></table></div>';
  }

  return feePage(title,sub,inner);
}

/* Combined fee page — "Setup + Year 1" beside "Year 2" on a single page,
   each side totalled separately. The Trust decks use this instead of two
   separate Setup/Fixed pages: for a trust there's no meaningful "one off vs
   annual" split, since year one bundles establishment with the first
   trustee fee. Same row data as the two-page form, laid out differently and
   with no grand total — the two figures aren't meant to be added. */
function pgFeeCombined(d){
  const cur='PRICE ('+(d.currency==='EUR'?'EUR':'US$')+')';
  const side=(which,caption)=>{
    const rows=STATE.fees[which].concat(
      (STATE.feeCols||[]).reduce((a,c)=>a.concat(c[which]),[]));
    return '<table class="deckfee">'+
      '<thead><tr><th>DESCRIPTIONS</th>'+
        '<th class="r">'+cur+'<div class="feecap">('+caption+')</div></th></tr></thead>'+
      '<tbody>'+feeBlocks(rows).map(feeBlockHTML).join('')+
        '<tr class="tot"><td>Total</td><td class="r">'+money(rowsTotal(rows))+'</td></tr>'+
      '</tbody></table>';
  };
  const inner='<div class="feewrap wide"><div class="feecols">'+
    side('setup','Setup + Year 1')+side('fixed','Year 2')+
    '</div></div>';
  return feePage('Fee Quote','— Proposed Structure',inner);
}

   The leaf-<service>.png assets are cropped straight out of the original
   AWL_PROPOSAL_AC_20260805.pdf at 300dpi, so the six labels and the
   per-service highlight colour are already part of the artwork — nothing
   is overlaid in CSS any more. Earlier attempts positioned the label text
   with percentage coordinates on top of a label-less graphic, which never
   lined up exactly and overflowed the leaf shapes; using the source
   artwork verbatim removes that whole class of problem.

   Geometry is taken from where the wheel actually sits on the source page
   (crop box x 2625..3542, y 600..1740 of a 3542x2246 render), expressed as
   percentages of the page so it lands in exactly the same spot. It bleeds
   off the right edge in the source, hence right:0 and .page's
   overflow:hidden doing the clipping. */
/* Two wheels exist, and they are different artwork rather than the same
   graphic with extra labels: the AC decks show six leaves, the GBC decks
