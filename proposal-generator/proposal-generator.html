<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurevya Wealth — Proposal Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   AUREVYA WEALTH — DESIGN TOKENS
   Derived from the sample proposal decks.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Colors below are pixel-sampled from the real AWL_PROPOSAL_AC_20260805.pdf
     (the deck staff were using manually) — the source design uses just two
     ink colors throughout (a near-black plum for backgrounds/headings/body
     text, and a single gold for every accent), not the wider palette this
     file used to guess at. */
  --plum:#130429;          /* cover / divider / back-cover panel + all "navy" heading/body ink */
  --plum-deep:#0B0219;
  --gold:#B59433;          /* headings, rules, accents, fee-table header bar — single gold throughout */
  --gold-bar:#B59433;      /* fee-table header bar (same gold as everything else) */
  --gold-pale:#E4D6B0;
  --navy:#130429;          /* body headings — same ink as --plum in the source deck, not a separate blue */
  --slate:#5A5468;         /* body copy — lighter tint for secondary text hierarchy */
  --hair:#D8DEE3;          /* hairline rules */
  --paper:#FFFFFF;
  --paper-alt:#F1F1F2;     /* disclaimer page bg */

  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif;

  /* Page geometry — landscape deck */
  --pw:297mm;
  --ph:186mm;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:#E9EBED;
  color:var(--navy);
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════════════════════════════
   APP CHROME  (hidden when printing)
   ═══════════════════════════════════════════════════════════════ */
#app{display:flex;min-height:100vh;}

#sidebar{
  width:390px;flex-shrink:0;background:#fff;border-right:1px solid #D5D9DD;
  height:100vh;overflow-y:auto;position:sticky;top:0;
}
#sidebar header{
  background:var(--plum);color:#fff;padding:18px 20px;
}
#sidebar header .logo{
  font-family:var(--serif);font-size:26px;letter-spacing:.02em;color:#fff;line-height:1;
}
#sidebar header .logo span{color:var(--gold);}
#sidebar header .sub{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:5px;
}
.panel{padding:16px 20px;border-bottom:1px solid #E6E9EC;}
.panel h3{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  margin:0 0 12px;font-weight:600;
}
label.f{display:block;margin-bottom:12px;}
label.f > span{
  display:block;font-size:11px;font-weight:500;color:var(--navy);margin-bottom:4px;
}
label.f > span .hint{font-weight:400;color:#9AA7B2;font-size:10px;}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid #CDD4DA;border-radius:5px;
  font-family:var(--sans);font-size:13px;color:var(--navy);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,168,76,.45);border-color:var(--gold);}
textarea{min-height:60px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

.checkline{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:12px;color:var(--navy);}
.checkline input{margin-top:2px;flex-shrink:0;}
.checkline .d{display:block;color:#94A3AE;font-size:10.5px;margin-top:1px;}

button.primary{
  width:100%;padding:11px;background:var(--plum);color:#fff;border:none;border-radius:6px;
  font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;
}
button.primary:hover{background:#3D1142;}
button.ghost{
  width:100%;padding:9px;background:#fff;color:var(--navy);border:1px solid #CDD4DA;
  border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;margin-top:8px;
}
button.ghost:hover{border-color:var(--gold);color:var(--gold);}

/* fee editor */
table.fees{width:100%;border-collapse:collapse;font-size:11.5px;}
table.fees th{
  text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#94A3AE;font-weight:600;padding:4px 3px;border-bottom:1px solid #E6E9EC;
}
table.fees td{padding:2px 3px;vertical-align:middle;}
table.fees td.grp{
  font-weight:600;color:var(--gold);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding-top:9px;
}
table.fees input[type=number]{padding:4px 6px;font-size:11.5px;text-align:right;}
table.fees input[type=text]{padding:4px 6px;font-size:11.5px;}
.feetot{
  display:flex;justify-content:space-between;font-size:12px;font-weight:700;
  color:var(--navy);border-top:2px solid var(--gold);margin-top:8px;padding-top:6px;
}

/* preview area */
#preview{flex:1;padding:26px;overflow-y:auto;height:100vh;}
#previewInner{max-width:1180px;margin:0 auto;}
.emptyState{
  text-align:center;color:#8D9AA5;padding:90px 20px;font-size:14px;
}
.emptyState .big{font-size:44px;margin-bottom:14px;opacity:.35;}

/* ═══════════════════════════════════════════════════════════════
   THE DECK — page primitives
   ═══════════════════════════════════════════════════════════════ */
.page{
  width:var(--pw);height:var(--ph);background:var(--paper);
  margin:0 auto 22px;position:relative;overflow:hidden;
  box-shadow:0 3px 16px rgba(0,0,0,.14);
  page-break-after:always;break-after:page;
}
.page:last-child{page-break-after:auto;break-after:auto;}

/* running footer */
.pfoot{
  position:absolute;left:0;right:0;bottom:6mm;
  display:flex;align-items:center;padding:0 10mm;
  font-size:5.6pt;letter-spacing:.09em;text-transform:uppercase;
}
.pfoot .l{color:var(--gold);flex:0 0 auto;}
.pfoot .c{flex:1;text-align:center;color:var(--slate);}
.pfoot .r{color:var(--slate);flex:0 0 auto;}
.pfoot .n{color:var(--gold);margin-left:9mm;flex:0 0 auto;font-weight:600;}
.page.dark .pfoot .c,.page.dark .pfoot .r{color:rgba(255,255,255,.55);}

/* crest */
.crest{position:absolute;top:8mm;right:10mm;text-align:center;}
.logoimg{max-width:32mm;object-fit:contain;}
.crest .mk{font-family:var(--serif);font-size:15pt;color:var(--navy);line-height:.95;letter-spacing:.01em;}
.crest .wm{font-size:4.4pt;letter-spacing:.42em;color:var(--slate);margin-top:1px;}
.page.dark .crest .mk{color:#fff;}
.page.dark .crest .wm{color:var(--gold);}
.crest .orn{color:var(--gold);font-size:9pt;line-height:1;margin-bottom:1px;}

/* page titles */
h1.ptitle{
  font-family:var(--serif);font-size:27pt;font-weight:400;color:var(--gold);
  margin:0;line-height:1.02;letter-spacing:.005em;
}
h1.ptitle em{font-style:italic;}
.psub{
  font-family:var(--serif);font-size:16pt;color:var(--navy);font-weight:400;
  margin-top:1mm;line-height:1.1;
}
.peyebrow{
  font-size:6.4pt;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  margin-bottom:1.5mm;
}
.plead{
  font-size:9.2pt;color:var(--gold);margin-top:3mm;line-height:1.4;
}
.pbody{padding:12mm 10mm 14mm;height:100%;display:flex;flex-direction:column;}

/* generic column grid */
.cols{display:grid;gap:6mm;margin-top:6mm;}
.cols.c2{grid-template-columns:repeat(2,1fr);}
.cols.c3{grid-template-columns:repeat(3,1fr);}
.cols.c4{grid-template-columns:repeat(4,1fr);}
.col h4{
  font-size:7.6pt;font-weight:600;letter-spacing:.055em;text-transform:uppercase;
  color:var(--gold);margin:0 0 1.6mm;line-height:1.25;
}
.col h4.navy{color:var(--navy);}
.col h4.ruled{border-bottom:.7px solid var(--gold);padding-bottom:1.4mm;margin-bottom:2.4mm;}
.col p{font-size:7.4pt;line-height:1.44;color:var(--slate);margin:0 0 2.4mm;}
.col ul{margin:0 0 2.6mm;padding-left:3.4mm;}
.col li{font-size:7.4pt;line-height:1.42;color:var(--slate);margin-bottom:1.1mm;}
.col .term{font-size:7.4pt;font-weight:600;color:var(--navy);margin-bottom:.5mm;}
.col .def{font-size:7.1pt;line-height:1.36;color:var(--slate);margin-bottom:2.6mm;}

/* Image slot.
   The real photograph is layered ON TOP of a tonal gradient. If the asset
   file is missing the url() simply fails and the gradient shows through —
   so the deck degrades gracefully instead of showing broken images. */
.imgslot{
  background-color:#241028;
  background-image:linear-gradient(150deg,#3E2436 0%,#241028 55%,#160A1C 100%);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  position:relative;overflow:hidden;
}
.imgslot.light{
  background-color:#C6CFD6;
  background-image:linear-gradient(150deg,#DDE3E7 0%,#C6CFD6 100%);
}
/* slot label only shows while the real image is absent */
.imgslot::after{
  content:attr(data-slot);position:absolute;left:0;right:0;bottom:3mm;text-align:center;
  font-size:4.6pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.16);
}
.imgslot.light::after{color:rgba(0,0,0,.13);}
.imgslot.hasimg::after{display:none;}

/* "contain" variant — for logos and the leaf wheel, which must not crop */
.imgslot.contain{
  background-size:contain;background-color:transparent;background-image:none;
}
.imgslot.contain::after{display:none;}

/* ── COVER ─────────────────────────────────────────────── */
.cover{display:grid;grid-template-columns:63% 37%;height:100%;}
.cover .art{position:relative;}
.cover .art .tag{
  position:absolute;left:9mm;bottom:9mm;color:#fff;font-family:var(--serif);
  font-size:13.5pt;font-weight:300;letter-spacing:.01em;
}
.cover .pane{
  background:var(--plum);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:12mm 9mm;position:relative;
}
/* 8.57mm, not the old 11mm: the white-gradient SVG carries ~9.2mm of its
   own transparent margin below the wordmark at this size, and the source
   cover has 17.8mm of clear space between the lockup and the title. */
.cover .pane .mark{margin-bottom:8.57mm;}
.cover .pane .mark .orn{color:var(--gold);font-size:19pt;line-height:1;}
.cover .pane .mark .nm{font-family:var(--serif);font-size:31pt;color:#fff;line-height:.95;margin-top:1mm;}
.cover .pane .mark .wm{font-size:6pt;letter-spacing:.52em;color:#fff;margin-top:1.5mm;}
.cover .pane .t1{font-size:13pt;font-weight:300;line-height:1.32;}
.cover .pane .t2{font-size:13pt;font-weight:600;line-height:1.32;}
.cover .pane .rule{width:22mm;height:.8px;background:var(--gold);margin:6mm auto;}
.cover .pane .pf{font-size:8.4pt;font-weight:300;margin-bottom:1mm;}
.cover .pane .cn{font-size:11pt;font-weight:600;}
.cover .pane .dt{font-size:8.6pt;font-weight:300;margin-top:6mm;}
.cover .pane .ent{
  position:absolute;right:8mm;bottom:7mm;font-size:5.2pt;letter-spacing:.08em;color:rgba(255,255,255,.85);
}
.cover .pane .ent b{font-weight:600;}

/* ── SECTION DIVIDER ───────────────────────────────────── */
.divider{position:relative;height:100%;display:flex;align-items:center;}
.divider .dtitle{
  position:relative;z-index:2;margin-left:auto;margin-right:14mm;text-align:left;max-width:46%;
}
.divider .dtitle h2{
  font-family:var(--serif);font-size:33pt;font-weight:400;color:#fff;line-height:1.04;margin:0;
}
.divider .dtitle .ds{
  font-size:7.4pt;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:3mm;
}
.divider .dtitle .drule{width:26mm;height:.8px;background:var(--gold);margin:3mm 0;}

/* ── CONTENTS ──────────────────────────────────────────── */
.contents{display:grid;grid-template-columns:52% 48%;height:100%;}
.contents .list{padding:14mm 11mm 14mm 10mm;display:flex;flex-direction:column;justify-content:center;}
.toc{margin-top:7mm;}
.toc .ti{
  display:flex;align-items:baseline;justify-content:space-between;gap:4mm;
  border-bottom:.6px solid var(--hair);padding:2.6mm 0;
}
.toc .ti .tt{font-family:var(--serif);font-size:12pt;color:var(--navy);}
.toc .ti .tn{font-family:var(--serif);font-size:12pt;color:var(--gold);}

/* ── DISCLAIMER ────────────────────────────────────────── */
.disclaimerbox{
  border:1px solid var(--gold);padding:6mm 7mm;margin-top:auto;
}
.disclaimerbox h4{
  font-size:8pt;font-weight:600;color:var(--gold);margin:0 0 3mm;letter-spacing:.02em;
}
.disclaimerbox .dc{columns:2;column-gap:8mm;}
.disclaimerbox p{
  font-size:7.1pt;line-height:1.5;color:var(--slate);margin:0 0 2.6mm;text-align:justify;
}

/* ── STRUCTURE DIAGRAM ─────────────────────────────────── */
.structpage{display:grid;grid-template-columns:32% 68%;height:100%;}
.structpage .lp{
  background:var(--plum);position:relative;padding:12mm 8mm;
}
.structpage .lp h2{
  font-family:var(--serif);font-size:23pt;color:var(--gold);font-weight:400;line-height:1.05;margin:0;
}
.structpage .lp .ss{
  font-size:6.6pt;letter-spacing:.19em;text-transform:uppercase;color:#fff;margin-top:2.5mm;
}
.structpage .lp .aw{
  position:absolute;left:8mm;bottom:8mm;font-size:5.2pt;letter-spacing:.16em;color:rgba(255,255,255,.75);
}
.structpage .rp{padding:14mm 12mm;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.diagram{width:100%;display:flex;flex-direction:column;align-items:center;gap:0;}
.dgrow{display:flex;align-items:stretch;justify-content:center;gap:7mm;width:100%;}
.node{
  border:.9px solid var(--navy);background:#fff;color:var(--navy);
  padding:3.4mm 5mm;text-align:center;font-size:8pt;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;line-height:1.22;min-width:38mm;
  display:flex;align-items:center;justify-content:center;
}
.node.filled{background:var(--gold-bar);border-color:var(--gold-bar);color:#fff;}
.node.plain{border:none;background:none;font-weight:600;padding:1mm 2mm;}
.node .cap{
  display:block;font-family:var(--serif);font-style:italic;font-size:7.4pt;
  font-weight:400;text-transform:none;letter-spacing:0;color:var(--slate);margin-top:1.5mm;
}
.node.cell{padding:1.6mm 2mm;font-size:6.2pt;min-width:0;}
.dragnode{user-select:none;}
.dragnode:active{cursor:grabbing !important;}

/* on-canvas "add" toolbar — screen-editing only, never in the PDF or
   the downloaded HTML (see .noprint / downloadHTML()) */
.structToolbar{position:absolute;top:0;left:0;display:flex;gap:1.5mm;z-index:5;}
.structAddBtn{
  font-family:var(--sans);font-size:5.6pt;font-weight:600;letter-spacing:.03em;
  color:var(--navy);background:#fff;border:.8px solid var(--gold);border-radius:20px;
  padding:1.4mm 3mm 1.4mm 2.2mm;cursor:pointer;display:flex;align-items:center;gap:1mm;
  box-shadow:0 1px 3px rgba(0,0,0,.14);white-space:nowrap;
}
.structAddBtn:hover{background:var(--gold);color:#fff;}
.structAddBtn .plus{font-size:8pt;font-weight:700;line-height:1;}

/* on-canvas delete badge — same screen-only, never-in-the-PDF treatment
   as the add toolbar above */
.nodeDelBtn{
  position:absolute;width:5.2mm;height:5.2mm;border-radius:50%;
  border:.8px solid var(--gold);background:#fff;color:var(--navy);
  font-size:6pt;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:6;
}
.nodeDelBtn:hover{background:#B23B3B;border-color:#B23B3B;color:#fff;}
.nodewrap{display:flex;flex-direction:column;align-items:center;}
.nodecap{
  font-family:var(--serif);font-style:italic;font-size:8pt;color:var(--navy);margin-top:2mm;
}
.personicon{
  width:13mm;height:13mm;border:.9px solid var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-bottom:3mm;color:var(--gold);font-size:13pt;
}
.connector{display:flex;flex-direction:column;align-items:center;position:relative;height:16mm;justify-content:center;}
.connector .ln{width:.9px;background:var(--navy);flex:1;}
.connector .ar{
  width:0;height:0;border-left:1.5mm solid transparent;border-right:1.5mm solid transparent;
  border-top:2.4mm solid var(--navy);
}
.connector .lb{
  position:absolute;left:calc(50% + 3mm);top:50%;transform:translateY(-50%);
  font-family:var(--serif);font-style:italic;font-size:10pt;font-weight:600;color:var(--gold);white-space:nowrap;
}
.hbar{height:.9px;background:var(--navy);width:100%;}
.hbarwrap{width:100%;display:flex;flex-direction:column;align-items:center;}
.harrow{display:flex;align-items:center;gap:2mm;margin:4mm 0;}
.harrow .hl{height:.9px;background:var(--navy);width:26mm;}
.harrow .hr{
  width:0;height:0;border-top:1.5mm solid transparent;border-bottom:1.5mm solid transparent;
  border-left:2.4mm solid var(--navy);
}
.harrow .hlbl{
  font-family:var(--serif);font-style:italic;font-size:7.6pt;color:var(--navy);text-align:center;line-height:1.2;
}
.dgnote{
  font-size:6.4pt;color:var(--slate);font-style:italic;margin-top:7mm;text-align:center;max-width:80%;line-height:1.4;
}

/* ── DOCUMENTATION PROCESS ─────────────────────────────── */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5mm;margin-top:5mm;flex:1;}
.step .sn{
  font-family:var(--serif);font-size:23pt;color:var(--gold);font-weight:400;line-height:1;margin-bottom:2.5mm;
}
.step .sh{
  font-size:7pt;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);
  border-top:.8px solid var(--gold);border-bottom:.8px solid var(--gold);
  padding:2mm 0;margin-bottom:3mm;min-height:12mm;line-height:1.25;
}
.step ul{margin:0;padding:0;list-style:none;}
.step li{font-size:6.6pt;line-height:1.38;color:var(--slate);margin-bottom:1.8mm;}

/* ── FEE TABLE ─────────────────────────────────────────── */
.feewrap{margin-top:6mm;width:64%;}
table.deckfee{width:100%;border-collapse:collapse;}
table.deckfee thead th{
  background:var(--gold-bar);color:#fff;font-size:7.4pt;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:2.6mm 3.5mm;text-align:left;
}
table.deckfee thead th.r{text-align:right;}
table.deckfee td{padding:1.1mm 3.5mm;font-size:7.6pt;color:var(--navy);vertical-align:middle;}
table.deckfee td.r{text-align:right;white-space:nowrap;}
table.deckfee tr.grp td{
  color:var(--gold);font-weight:600;font-size:7.4pt;letter-spacing:.05em;
  text-transform:uppercase;padding-top:3.4mm;
}
table.deckfee tr.rule td{border-bottom:.6px solid var(--hair);}
table.deckfee tr.tot td{
  border-top:.9px solid var(--gold);border-bottom:.9px solid var(--gold);
  font-weight:700;font-size:8.4pt;padding-top:2.2mm;padding-bottom:2.2mm;
}
.feenote{font-size:6.2pt;color:var(--slate);font-style:italic;line-height:1.45;margin-top:3.5mm;width:64%;}

/* ── SERVICE PAGES (leaf wheel) ────────────────────────── */
/* The wheel is now absolutely positioned against .page (see leafCol()), so
   the text area just needs to stop short of it rather than reserve a grid
   column — 72% keeps the three text columns clear of the artwork. */
.svcpage{width:72%;height:100%;}

/* ── BACK COVER ────────────────────────────────────────── */
.backcover{background:var(--plum);height:100%;padding:16mm 12mm;color:#fff;position:relative;}
.backcover .bt{font-size:13pt;font-weight:300;line-height:1.35;}
.backcover .bt b{font-weight:600;}
/* left/bottom account for the SVG's own transparent margin so the visible
   lockup lands at 24.0mm from the left and 109.5mm from the top, matching
   the source back cover. */
.backcover .bm{position:absolute;left:20.40mm;bottom:50.47mm;}
.backcover .bm .orn{color:var(--gold);font-size:15pt;line-height:1;}
.backcover .bm .nm{font-family:var(--serif);font-size:22pt;color:#fff;line-height:.95;}
.backcover .bm .wm{font-size:4.6pt;letter-spacing:.5em;color:#fff;margin-top:1mm;}
.backcover .addr{position:absolute;left:12mm;bottom:16mm;font-size:6.8pt;line-height:1.6;color:rgba(255,255,255,.92);}
.backcover .addr b{font-weight:600;}
.backcover .ent{position:absolute;left:12mm;bottom:8mm;font-size:5.2pt;letter-spacing:.08em;color:rgba(255,255,255,.85);}
.backcover .lic{position:absolute;right:12mm;bottom:8mm;font-size:5.2pt;color:rgba(255,255,255,.75);}

/* ═══════════════════════════════════════════════════════════════
   PRINT
   ═══════════════════════════════════════════════════════════════ */
@page{size:297mm 186mm;margin:0;}
@media print{
  body{background:#fff;}
  #sidebar,#toolbar,.noprint{display:none !important;}
  #app{display:block;}
  #preview{padding:0;height:auto;overflow:visible;}
  #previewInner{max-width:none;}
  .page{margin:0;box-shadow:none;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

#toolbar{
  position:sticky;top:0;z-index:20;background:rgba(233,235,237,.94);
  backdrop-filter:blur(6px);padding:0 0 16px;margin:-26px -26px 20px;
  padding:14px 26px;border-bottom:1px solid #D5D9DD;display:flex;gap:10px;align-items:center;
}
#toolbar .ti{font-size:12px;color:var(--slate);flex:1;}
#toolbar button{
  padding:8px 15px;border-radius:6px;font-family:var(--sans);font-size:12px;
  font-weight:600;cursor:pointer;border:1px solid #CDD4DA;background:#fff;color:var(--navy);
}
#toolbar button.go{background:var(--plum);color:#fff;border-color:var(--plum);}

/* live-preview affordances */
.liveband{
  display:flex;align-items:center;gap:7px;font-size:11px;color:var(--slate);
  background:#F5F2E9;border:1px solid #E4DAC2;border-radius:5px;
  padding:7px 9px;margin-bottom:10px;line-height:1.3;
}
.liveband .dot{
  width:7px;height:7px;border-radius:50%;background:#22A559;flex-shrink:0;
  box-shadow:0 0 0 0 rgba(34,165,89,.55);animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,165,89,.5);}
  70%{box-shadow:0 0 0 6px rgba(34,165,89,0);}
  100%{box-shadow:0 0 0 0 rgba(34,165,89,0);}
}
#previewInner{transition:opacity .12s ease;}
#previewInner.busy{opacity:.55;}
#tbLive{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#22A559;
  font-weight:600;margin-right:10px;opacity:0;transition:opacity .2s;
}
#tbLive.on{opacity:1;}
</style>

<div id="app">

  <!-- ══════════════ SIDEBAR / WIZARD ══════════════ -->
  <aside id="sidebar" class="noprint">
    <header>
      <div class="logo">aurevya<span>.</span></div>

    </header>

      <h3>1 · Proposal Type</h3>
      <label class="f">

        <select id="fMode">
          <option value="structure">Mauritius Structure — build your own</option>
          <option value="mfo">Multiple Family Office (MFO)</option>
          <option value="fundlux">Luxembourg Fund Platform</option>
          <option value="accounting">Accounting Services</option>
        </select>
      </label>
      <div id="entityFields">
        <label class="f">
          <span>Company type</span>
          <select id="fCompany">
            <option value="ac">Authorised Company (AC)</option>
            <option value="gbc">Global Business Company (GBC)</option>
            <option value="none">None — no company layer</option>
          </select>
        </label>
        <label class="checkline">
          <input type="checkbox" id="fTrust">
          <span>Add a Trust<span class="d">Wraps the company — Settlor → Trust → Company</span></span>
        </label>
        <label class="checkline">
          <input type="checkbox" id="fCis">
          <span>Add a CIS — Protected Cell Company<span class="d">Fund vehicle layered beneath the structure</span></span>
        </label>
        <label class="checkline" id="fNomineeRow">
          <input type="checkbox" id="fNominee">
          <span>Nominee shareholder (AC only)<span class="d">Optional add-on — tick only if the client wants Aurevya to hold the shares as nominee</span></span>
        </label>
      </div>
      <div id="productBlurb" style="font-size:11px;color:#8D9AA5;line-height:1.45;margin-top:8px;"></div>
    </div>

    <div class="panel">
      <h3>2 · Client</h3>
      <label class="f">
        <span>Prepared for <span class="hint">— appears on cover</span></span>
        <input type="text" id="fClient" placeholder="Mr. Peter" />
      </label>
      <div class="row2">
        <label class="f">
          <span>Month</span>
          <select id="fMonth"></select>
        </label>
        <label class="f">
          <span>Year</span>
          <input type="number" id="fYear" value="2026" />
        </label>
      </div>
      <label class="f">
        <span>Currency</span>
        <select id="fCurrency">
          <option value="USD">USD — US$</option>
          <option value="EUR">EUR — €</option>
        </select>
      </label>
    </div>

    <div class="panel">
      <h3>3 · Structure</h3>
      <div id="structFields"></div>
    </div>

    <div class="panel">
      <h3>4 · Sections</h3>
      <div id="sectionToggles"></div>
    </div>

    <div class="panel">
      <h3>5 · Setup Fee <span style="float:right;font-weight:400;text-transform:none;letter-spacing:0;color:#94A3AE;">one off</span></h3>
      <table class="fees"><tbody id="feeSetup"></tbody></table>
      <div class="feetot"><span>TOTAL</span><span id="feeSetupTotal">—</span></div>
    </div>

    <div class="panel">
      <h3>6 · Fixed Fee <span style="float:right;font-weight:400;text-transform:none;letter-spacing:0;color:#94A3AE;">year one onwards</span></h3>
      <table class="fees"><tbody id="feeFixed"></tbody></table>
      <div class="feetot"><span>TOTAL</span><span id="feeFixedTotal">—</span></div>
    </div>

    <div class="panel">
      <div class="liveband"><span class="dot"></span> Live preview — every change updates the deck</div>
      <button class="primary" onclick="window.print()">Export PDF</button>
      <button class="ghost" onclick="downloadHTML()">Download HTML</button>
      <button class="ghost" onclick="resetFees();liveBuild()">Reset fees to price book</button>
    </div>
  </aside>

  <!-- ══════════════ PREVIEW ══════════════ -->
  <main id="preview">
    <div id="toolbar" class="noprint">
      <div class="ti" id="tbInfo">Loading…</div>
      <span id="tbLive">● updating</span>
      <button onclick="zoom(-1)">−</button>
      <button onclick="zoom(1)">+</button>
      <button class="go" onclick="window.print()">Export PDF</button>
    </div>
    <div id="previewInner">
      <div class="emptyState">
        <div class="big">◈</div>
        <div>Your proposal will appear here.</div>
      </div>
    </div>
  </main>

</div>

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ═══════════════════════════════════════════════════════════════
   MODULAR STRUCTURE BUILDER
   "Mauritius Structure" mode replaces the old fixed list of named
   combinations (AC / GBC / Trust+GBC / Trust+GBC+CIS) with three
   independent choices that compose freely:
     — Company type: Authorised Company, Global Business Company, or none
     — Trust wrapper: on/off
     — CIS (Protected Cell Company): on/off
   Every combination — a bare Trust, GBC+CIS with no Trust, AC+Trust,
   a standalone CIS, and so on — is generated from the same building
   blocks below, rather than needing a new PRODUCTS entry each time a
   client needs something the fixed list didn't cover.
   MFO, the Luxembourg Fund Platform and Accounting Services stay as
   their own modes (see PRODUCTS above) since their content isn't
   really "composable" with the Mauritius entities — different
   jurisdiction, currency, licence and deck shape entirely.
   ═══════════════════════════════════════════════════════════════ */
const ENTITY_META = {
  trust:{article:'a',name:'Trust',short:'Trust'},
  ac:{article:'an',name:'Authorised Company',short:'AC'},
  gbc:{article:'a',name:'Global Business Company',short:'GBC'},
  cis:{article:'a',name:'Collective Investment Scheme (PCC)',short:'CIS (PCC)'}
};

/* returns the selected entity keys in canonical deck order: trust, then
   the company (if any), then cis */
function entityOrder(ent){
  const list=[];
  if(ent.trust)list.push('trust');
  if(ent.company!=='none')list.push(ent.company);
  if(ent.cis)list.push('cis');
  return list;
}

/* "a Trust, a Global Business Company and a Collective Investment
   Scheme (PCC)" — or the upper-case running-footer equivalent */
function joinPhrase(list,upper){
  const parts=list.map(k=>{
    const m=ENTITY_META[k];
    return (upper?m.article.toUpperCase():m.article)+' '+(upper?m.name.toUpperCase():m.name);
  });
  if(parts.length===0)return '';
  if(parts.length===1)return parts[0];
  if(parts.length===2)return parts[0]+' and '+parts[1];
  return parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1];
}

function priceKeysFor(ent){
  const k=[];
  if(ent.trust)k.push('trust');
  if(ent.company!=='none')k.push(ent.company);
  if(ent.company==='ac'&&ent.nominee)k.push('nominee');
  if(ent.cis)k.push('cis');
  return k;
}

function glossaryScopeStructure(ent){
  const g=['base'];
  if(ent.trust)g.push('trust');
  if(ent.cis)g.push('fund');
  return g;
}

/* canonical page sequence for whatever combination is selected —
   every branch below reuses an existing emit() case, so no renderer
   changes are needed when new combinations are picked */
function structureSections(ent){
  const s=['contents','glossary','ourgroup','about','whatwedo','structdivider','structure'];
  if(ent.trust)s.push('trustfacts','trustparties','trustvalidity');
  if(ent.company==='ac')s.push('ackeydivider','ackeyfeatures');
  if(ent.company==='gbc')s.push('gbcdivider','gbcoverview');
  if(ent.cis)s.push('cisdivider','cisoverview');
  if(ent.trust)s.push('docprocess_trust');
  if(ent.company!=='none')s.push('docprocess_company');
  if(ent.cis)s.push('docprocess_cis');
  s.push('kyc','feesetup','feefixed','leaf','svc_board','svc_accounting','svc_legal','svc_compliance','svc_it');
  s.push(ent.company==='gbc'?'svc_media':'svc_concierge');
  s.push('back');
  return s;
}

/* ── freeform structure canvas ────────────────────────────────────
   The structure diagram is a small editable org-chart: nodes sit at
   an (x,y) position in mm on a fixed-size canvas and can be dragged;
   any node can be added/removed from the sidebar (shareholders,
   generic entity boxes for trusts/companies/anything else, and CIS
   cells), and connections between them are editable too. Only three
   visual "kinds" exist — the label text is whatever the user types.
     shareholder — plain text + circle icon, never filled
     box         — the standard outline box; filled gold only if
                   it's the diagram's one "primary" (headline) entity
     ciscell     — a small chip, used for individual CIS/PCC cells
   ───────────────────────────────────────────────────────────────── */
const NODE_DIM={shareholder:{w:28,h:22},box:{w:48,h:16},ciscell:{w:26,h:11}};
const KIND_LABEL={shareholder:'Shareholder',box:'Entity',ciscell:'CIS Cell'};

/* shared with addCoreEntity() below, which splices Trust/CIS into an
   already-customised diagram — the heading needs to update the same
   way whether the diagram was just (re)seeded or edited incrementally */
function structTitleFor(ent){
  const activeCount=(ent.trust?1:0)+(ent.company!=='none'?1:0)+(ent.cis?1:0);
  const complex=ent.trust&&ent.company!=='none'&&ent.cis;
  const simple=activeCount<=1;
  return{title:simple?'Your Tailored<br>Solution':(complex?'Bespoke Solution':'Tailored Solution'),
    sub:simple?'':'PROPOSED STRUCTURE'};
}

/* the default chain: Settlor/Shareholder → Trust (if any) → Company
   (if any) → CIS (if any), with two starter cells under the CIS.
   Whichever entity is last in the chain is drawn filled/gold. */
function buildStructureSpec(ent){
  const W=175;
  const nodes=[],edges=[];
  const cx=W/2;
  let y=10;
  const place=(kind,label,id,cap)=>{
    const d=NODE_DIM[kind];
    nodes.push({id:id,kind:kind,label:label,x:cx-d.w/2,y:y,primary:false,cap:cap||''});
    y+=(kind==='shareholder'?32:34);
    return id;
  };
  let prev;
  if(ent.trust){
    prev=place('shareholder','SETTLOR','settlor');
    const tid=place('box','TRUST','trust');
    edges.push({id:'e1',from:prev,to:tid,label:''});
    prev=tid;
  }else{
    prev=place('shareholder','SHAREHOLDER','sh');
  }
  if(ent.company!=='none'){
    const label=ent.company==='gbc'?'GLOBAL BUSINESS<br>COMPANY':'AUTHORISED<br>COMPANY';
    const cid=place('box',label,ent.company);
    edges.push({id:'e2',from:prev,to:cid,label:'100%'});
    prev=cid;
  }
  let primaryId=prev;
  if(ent.cis){
    const cisId=place('box','CIS — PROTECTED<br>CELL COMPANY','cis');
    edges.push({id:'e3',from:prev,to:cisId,label:'100%'});
    primaryId=cisId;
    const cd=NODE_DIM.ciscell,cellY=y+2;
    nodes.push({id:'cellA',kind:'ciscell',label:'CELL A',x:cx-cd.w-4,y:cellY,primary:false,cap:''});
    nodes.push({id:'cellB',kind:'ciscell',label:'CELL B',x:cx+4,y:cellY,primary:false,cap:''});
    edges.push({id:'e4',from:cisId,to:'cellA',label:''});
    edges.push({id:'e5',from:cisId,to:'cellB',label:''});
    y=cellY+cd.h+10;
  }
  nodes.forEach(n=>{n.primary=(n.id===primaryId);});
  const t=structTitleFor(ent);
  return{
    title:t.title,sub:t.sub,
    canvasW:W,canvasH:Math.max(150,y+8),
    nodes:nodes,edges:edges
  };
}

/* human-readable label for the sidebar dropdown blurb and export filename,
   e.g. "AC + Trust" or "Trust + GBC + CIS (PCC)" */
function structureLabel(list){
  return list.length?list.map(k=>ENTITY_META[k].short).join(' + '):'Mauritius Structure';
}

/* Builds a PRODUCTS-shaped spec on the fly for "Mauritius Structure" mode;
   for every other mode, just returns the matching static PRODUCTS entry
   (their keys — mfo, fundlux, accounting — match the mode names exactly). */
function currentSpec(){
  if(STATE.mode!=='structure')return PRODUCTS[STATE.mode];
  const ent=STATE.entities;
  const list=entityOrder(ent);
  return{
    label:structureLabel(list),
    blurb:list.length
      ? 'Custom Mauritius structure — '+structureLabel(list)+'. Sections, structure diagram and fees adjust automatically for whatever is selected.'
      : 'Choose a company type, and optionally add a Trust and/or a CIS (PCC), to build this proposal.',
    coverT1:'Proposal for setting up',
    coverT2:joinPhrase(list,false),
    running:'PROPOSAL FOR SETTING UP '+joinPhrase(list,true),
    priceKeys:priceKeysFor(ent),
    glossary:glossaryScopeStructure(ent),
    sections:structureSections(ent),
    structure:buildStructureSpec(ent),
    docKeyCompany:ent.company==='none'?null:ent.company
  };
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE + WIZARD
   ═══════════════════════════════════════════════════════════════ */
let STATE={mode:'structure',entities:{company:'ac',trust:false,cis:false,nominee:false},fees:{setup:[],fixed:[]},sections:{},struct:{}};

function $(id){return document.getElementById(id);}
function money(n,cur){
  if(n===''||n===null||n===undefined||isNaN(n))return '';
  return Number(n).toLocaleString('en-US');
}
function curSym(){return $('fCurrency').value==='EUR'?'€':'US$';}

function initWizard(){
  const ms=$('fMonth');
  MONTHS.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m;ms.appendChild(o);});
  ms.value=new Date().getMonth();
  $('fYear').value=new Date().getFullYear();
  $('fMode').addEventListener('change',onModeOrEntityChange);
  $('fCompany').addEventListener('change',onModeOrEntityChange);
  $('fTrust').addEventListener('change',onModeOrEntityChange);
  $('fCis').addEventListener('change',onModeOrEntityChange);
  $('fNominee').addEventListener('change',onModeOrEntityChange);
  $('fCurrency').addEventListener('change',()=>{renderFeeEditor();});
  onModeOrEntityChange();
}

function onModeOrEntityChange(){
  STATE.mode=$('fMode').value;
  const isStructure=STATE.mode==='structure';
  $('entityFields').style.display=isStructure?'':'none';
  if(isStructure){
    STATE.entities.company=$('fCompany').value;
    STATE.entities.trust=$('fTrust').checked;
    STATE.entities.cis=$('fCis').checked;
    STATE.entities.nominee=$('fNominee').checked;
    if(STATE.entities.company==='none'&&!STATE.entities.trust&&!STATE.entities.cis){
      /* never allow a completely empty structure — fall back to AC */
      STATE.entities.company='ac';$('fCompany').value='ac';
    }
    const nomRow=$('fNomineeRow');
    if(nomRow)nomRow.style.display=(STATE.entities.company==='ac')?'':'none';
  }
  const p=currentSpec();
  $('productBlurb').textContent=p.blurb;
  if(p.currency)$('fCurrency').value=p.currency;
  resetFees();
  renderSectionToggles();
  renderStructFields();
  syncCellFees();
}

function resetFees(){
  const p=currentSpec();
  STATE.fees.setup=composeFees(p.priceKeys,'setup');
  STATE.fees.fixed=composeFees(p.priceKeys,'fixed');
  renderFeeEditor();
}

function renderFeeEditor(){
  ['setup','fixed'].forEach(which=>{
    const tb=$(which==='setup'?'feeSetup':'feeFixed');
    tb.innerHTML='';
    STATE.fees[which].forEach((r,i)=>{
      const tr=document.createElement('tr');
      if(r.t==='grp'){
        tr.innerHTML='<td class="grp" colspan="2">'+r.l+'</td>';
      }else{
        const priced=r.t==='item';
        tr.innerHTML='<td><input type="text" value="'+r.l.replace(/"/g,'&quot;')+'" '+
          'oninput="STATE.fees.'+which+'['+i+'].l=this.value"/></td>'+
          '<td style="width:78px">'+(priced?
            '<input type="number" value="'+(r.v||0)+'" oninput="STATE.fees.'+which+'['+i+'].v=+this.value;feeTotals()"/>':
            '<span style="color:#C3CCD3;font-size:10px;">incl.</span>')+'</td>';
      }
      tb.appendChild(tr);
    });
  });
  feeTotals();
}

function feeTotal(which){
  return STATE.fees[which].reduce((s,r)=>s+(r.t==='item'?(+r.v||0):0),0);
}
function feeTotals(){
  $('feeSetupTotal').textContent=curSym()+' '+money(feeTotal('setup'));
  $('feeFixedTotal').textContent=curSym()+' '+money(feeTotal('fixed'));
}

const SECTION_LABELS={
  disclaimer:['Disclaimer','Legal disclaimer page — absent from most current decks'],
  contents:['Contents','Table of contents'],
  glossary:['Glossary of Terms','Auto-scoped to the product'],
  ourgroup:['Our Group','Kundomal & Co group companies'],
  about:['About Aurevya','Four values panel'],
  whatwedo:['What We Do','Four client segments'],
  structdivider:['Structure divider','Full-bleed section divider'],
  structure:['Tailored Solution','The structure diagram'],
  ackeydivider:['Key Features divider',''],
  ackeyfeatures:['Key Features of an AC',''],
  gbcdivider:['GBC divider',''],
  gbcoverview:['GBC Comprehensive Overview','3 pages'],
  cisdivider:['CIS divider',''],
  cisoverview:['CIS / PCC Overview','Newly authored — absent from source deck'],
  trustfacts:['Key Facts about the Trust',''],
  trustparties:['Key Parties to a Trust',''],
  trustvalidity:['Trust Validity',''],
  docprocess_trust:['Documentation Process — Trust',''],
  docprocess_company:['Documentation Process — Company',''],
  docprocess_cis:['Documentation Process — CIS / PCC',''],
  docprocess:['Documentation Process',''],
  kyc:['KYC Documents',''],
  feesetup:['Setup Fee table',''],
  feefixed:['Fixed Fee table',''],
  leaf:['Our Services','Leaf wheel overview'],
  svc_board:['— Board Services & Directorship',''],
  svc_accounting:['— Accounting & Finance',''],
  svc_legal:['— Legal & Governance',''],
  svc_compliance:['— Compliance',''],
  svc_it:['— IT Management & Cybersecurity',''],
  svc_concierge:['— Concierge Services',''],
  svc_media:['— Media Monitoring & Communication',''],
  back:['Back cover','']
};

function renderSectionToggles(){
  const p=currentSpec();
  const box=$('sectionToggles');box.innerHTML='';
  STATE.sections={};
  const all=p.sections.slice();
  if(!all.includes('disclaimer'))all.unshift('disclaimer');
  all.forEach(s=>{
    const on=p.sections.includes(s);
    STATE.sections[s]=on;
    const lbl=SECTION_LABELS[s]||[s,''];
    const d=document.createElement('label');d.className='checkline';
    d.innerHTML='<input type="checkbox" '+(on?'checked':'')+
      ' onchange="STATE.sections[\''+s+'\']=this.checked">'+
      '<span>'+lbl[0]+(lbl[1]?'<span class="d">'+lbl[1]+'</span>':'')+'</span>';
    box.appendChild(d);
  });
}

function renderStructFields(){
  const p=currentSpec();
  if(!p.structure){$('structFields').innerHTML='<div style="font-size:11px;color:#94A3AE;">This proposal type has no structure diagram.</div>';STATE.struct=null;return;}
  /* only re-seed the default layout when the proposal type/entities
     change (i.e. whenever this function runs) — drag positions, added
     nodes and edited labels otherwise survive every other edit, since
     nothing else calls renderStructFields */
  STATE.struct=JSON.parse(JSON.stringify(p.structure));
  renderStructEditorUI();
}

/* redraw the sidebar's node/edge list for whatever STATE.struct
   currently is — called after every add/remove, independently of the
   full renderStructFields() reset above */
function renderStructEditorUI(){
  const box=$('structFields');
  const st=STATE.struct;
  if(!st||!st.nodes){box.innerHTML='<div style="font-size:11px;color:#94A3AE;">This proposal type has no structure diagram.</div>';return;}

  let html='<div style="font-size:10.5px;color:#8D9AA5;line-height:1.4;margin-bottom:8px;">Drag any box directly on the diagram to reposition it.</div>';

  st.nodes.forEach((n,i)=>{
    const isCore=CORE_NODE_IDS.includes(n.id);
    html+='<label class="f"><span>'+KIND_LABEL[n.kind]+' '+(i+1)+
      (isCore?' <span class="hint">— Section 1</span>':'')+'</span>'+
      '<div style="display:flex;gap:5px;align-items:center">'+
      '<input type="text" style="flex:1" value="'+n.label.replace(/<br>/g,' ').replace(/"/g,'&quot;')+'" '+
      'oninput="STATE.struct.nodes['+i+'].label=this.value;redrawStructure()">'+
      (st.nodes.length>1?'<button type="button" class="ghost" style="width:auto;padding:6px 9px;margin:0" onclick="removeAnyNode(\''+n.id+'\')">✕</button>':'')+
      '</div></label>';
  });

  if(st.edges.length){
    html+='<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:10px 0 6px;">Connections</div>';
    st.edges.forEach((e,i)=>{
      html+='<div class="row2" style="align-items:end;margin-bottom:4px">'+
        '<label class="f" style="margin-bottom:0"><span>From</span>'+nodeSelect('STATE.struct.edges['+i+'].from',e.from,st.nodes)+'</label>'+
        '<label class="f" style="margin-bottom:0"><span>To</span>'+nodeSelect('STATE.struct.edges['+i+'].to',e.to,st.nodes)+'</label>'+
        '</div>'+
        '<div style="display:flex;gap:5px;align-items:center;margin-bottom:10px">'+
        '<input type="text" style="flex:1" placeholder="Label, e.g. 100%" value="'+(e.label||'').replace(/"/g,'&quot;')+'" '+
        'oninput="STATE.struct.edges['+i+'].label=this.value;redrawStructure()">'+
        '<button type="button" class="ghost" style="width:auto;padding:6px 9px;margin:0" onclick="removeStructEdge(\''+e.id+'\')">✕</button>'+
        '</div>';
    });
  }

  const ent=STATE.entities||{};
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px">'+
    '<button type="button" class="ghost" style="margin:0" onclick="addStructNode(\'shareholder\')">+ Shareholder</button>'+
    '<button type="button" class="ghost" style="margin:0" onclick="addStructNode(\'box\')">+ Entity box</button>'+
    (STATE.mode==='structure'&&!ent.trust?'<button type="button" class="ghost" style="margin:0" onclick="addCoreEntity(\'trust\')">+ Trust</button>':'')+
    (STATE.mode==='structure'&&!ent.cis?'<button type="button" class="ghost" style="margin:0" onclick="addCoreEntity(\'cis\')">+ CIS</button>':'')+
    (STATE.mode==='structure'&&ent.cis?'<button type="button" class="ghost" style="margin:0" onclick="addStructNode(\'ciscell\')">+ CIS Cell</button>':'')+
    '<button type="button" class="ghost" style="margin:0" onclick="addStructEdge()">+ Connection</button>'+
    '</div>'+
    '<button type="button" class="ghost" onclick="resetStructure()">Reset diagram to default</button>'+
    '<label class="f" style="margin-top:10px"><span>Diagram note <span class="hint">(optional)</span></span>'+
    '<textarea oninput="STATE.struct.note=this.value;redrawStructure()">'+(st.note||'')+'</textarea></label>';

  box.innerHTML=html;
}

function nodeSelect(path,val,nodes){
  return '<select onchange="'+path+'=this.value;redrawStructure()">'+
    nodes.map(n=>'<option value="'+n.id+'"'+(n.id===val?' selected':'')+'>'+n.label.replace(/<br>/g,' ')+'</option>').join('')+
    '</select>';
}

/* re-render the live preview without re-seeding the diagram — used by
   every sidebar edit (label text, connections, add/remove buttons) */
function redrawStructure(){liveBuild(0);}

/* these ids come straight from Section 1 (Company/Trust/CIS toggles),
   so they're not removable from the diagram directly — deleting one
   there without also unchecking Section 1 would leave the fee table,
   the glossary and the document sections out of sync with what the
   diagram shows. Everything else added from the diagram's own "+"
   controls (extra shareholders, entity boxes, CIS cells) is fair game. */
const CORE_NODE_IDS=['ac','gbc','trust','cis'];

let _structSeq=1;
function newStructId(){return 'x'+(_structSeq++)+'_'+Date.now().toString(36);}

/* Keeps the price book's "Each additional cell" line in step with how
   many CIS cell boxes are actually on the diagram. The base PRICEBOOK.cis
   entry already covers the first cell (in "PCC incorporation and first
   cell"); this line only covers cells beyond that one. If the user has
   already retyped that line into something else, it's left alone — once
   someone takes manual control of a fee line we stop auto-managing it. */
function syncCellFees(){
  if(STATE.mode!=='structure'||!STATE.entities.cis||!STATE.struct)return;
  const cellCount=STATE.struct.nodes.filter(n=>n.kind==='ciscell').length;
  const extra=Math.max(0,cellCount-1);
  ['setup','fixed'].forEach(which=>{
    const base=(PRICEBOOK.cis[which]||[]).find(r=>r.t==='item'&&/each additional cell/i.test(r.l));
    const line=STATE.fees[which].find(r=>r.t==='item'&&/each additional cell/i.test(r.l));
    if(!base||!line)return;
    if(extra>0){line.l='Each additional cell (× '+extra+')';line.v=base.v*extra;}
    else{line.l='Each additional cell';line.v=0;}
  });
  renderFeeEditor();
}

function defaultConnectTarget(st,kind){
  if(kind==='ciscell'){
    const cis=st.nodes.find(n=>n.kind==='box'&&/CIS/.test(n.label));
    return cis?cis.id:(st.nodes[st.nodes.length-1]?st.nodes[st.nodes.length-1].id:null);
  }
  const anchor=st.nodes.find(n=>n.kind==='box');
  return anchor?anchor.id:(st.nodes[0]?st.nodes[0].id:null);
}

/* every node reachable by following edges forward from startId,
   including startId itself — used to shift a whole downstream branch
   out of the way when a new box gets spliced into the middle of it */
function collectDownstream(st,startId){
  const seen=new Set(),queue=[startId];
  while(queue.length){
    const cur=queue.pop();
    if(seen.has(cur))continue;
    seen.add(cur);
    st.edges.filter(e=>e.from===cur).forEach(e=>queue.push(e.to));
  }
  return seen;
}

/* "+ Trust" / "+ CIS" on the canvas toolbar — unlike a generic "+ Entity"
   box, these are real Section-1 entities: they need the actual Trust/CIS
   document sections, glossary terms and price-book fees to switch on,
   not just an inert box. So this flips the same STATE.entities flag the
   Section 1 checkbox does (and checks that checkbox to match), then
   splices the node into whatever diagram is already there instead of
   reseeding the whole thing — existing shareholders, entity boxes, cells
   and drag positions are left untouched. */
function addCoreEntity(kind){
  if(STATE.mode!=='structure'||!STATE.struct||STATE.entities[kind])return;
  STATE.entities[kind]=true;
  const cb=$(kind==='trust'?'fTrust':'fCis');if(cb)cb.checked=true;
  resetFees();
  renderSectionToggles();
  spliceCoreNode(kind);
  syncCellFees();
  renderStructEditorUI();
  redrawStructure();
}

function spliceCoreNode(kind){
  const st=STATE.struct,bd=NODE_DIM.box;
  if(kind==='trust'){
    if(st.nodes.some(n=>n.id==='trust'))return;
    const sh=st.nodes.find(n=>n.kind==='shareholder')||st.nodes[0];
    const outEdge=st.edges.find(e=>e.from===sh.id);
    if(outEdge){
      collectDownstream(st,outEdge.to).forEach(id=>{
        const n=st.nodes.find(x=>x.id===id);if(n)n.y+=34;
      });
    }
    const cx=sh.x+(NODE_DIM.shareholder.w/2);
    const node={id:'trust',kind:'box',label:'TRUST',x:cx-bd.w/2,y:sh.y+34,primary:false,cap:''};
    st.nodes.push(node);
    st.edges.push({id:newStructId(),from:sh.id,to:'trust',label:''});
    if(outEdge)outEdge.from='trust';else node.primary=true;
    if(sh.label==='SHAREHOLDER')sh.label='SETTLOR';
  }else if(kind==='cis'){
    if(st.nodes.some(n=>n.id==='cis'))return;
    const anchor=st.nodes.find(n=>n.primary)||st.nodes.find(n=>n.kind==='shareholder')||st.nodes[0];
    const ad=NODE_DIM[anchor.kind]||bd;
    const cx=anchor.x+ad.w/2;
    const y=anchor.y+34;
    const node={id:'cis',kind:'box',label:'CIS — PROTECTED<br>CELL COMPANY',x:cx-bd.w/2,y:y,primary:true,cap:''};
    anchor.primary=false;
    st.nodes.push(node);
    st.edges.push({id:newStructId(),from:anchor.id,to:'cis',label:'100%'});
    const cd=NODE_DIM.ciscell,cellY=y+bd.h+2;
    st.nodes.push({id:'cellA',kind:'ciscell',label:'CELL A',x:cx-cd.w-4,y:cellY,primary:false,cap:''});
    st.nodes.push({id:'cellB',kind:'ciscell',label:'CELL B',x:cx+4,y:cellY,primary:false,cap:''});
    st.edges.push({id:newStructId(),from:'cis',to:'cellA',label:''});
    st.edges.push({id:newStructId(),from:'cis',to:'cellB',label:''});
  }
  const t=structTitleFor(STATE.entities);
  st.title=t.title;st.sub=t.sub;
  st.canvasH=Math.max(st.canvasH,st.nodes.reduce((m,n)=>Math.max(m,n.y+(NODE_DIM[n.kind]||bd).h),0)+14);
}

/* the reverse of addCoreEntity() — deleting Trust, CIS, or the Company
   box directly from the canvas. It unchecks the matching Section 1
   control, rebuilds fees/sections the same way unchecking it by hand
   would, then repairs the diagram: whatever was upstream of the removed
   box gets reconnected straight to whatever was downstream of it, and a
   removed CIS takes its cells with it. Refuses to leave a completely
   empty structure. `slot` is 'company' | 'trust' | 'cis'. */
function removeCoreEntity(slot){
  if(STATE.mode!=='structure'||!STATE.struct)return;
  let nodeId;
  if(slot==='company'){
    if(STATE.entities.company==='none')return;
    if(!STATE.entities.trust&&!STATE.entities.cis){
      alert('A structure needs at least one entity. Add a Trust or CIS first, or change the company type in Section 1.');
      return;
    }
    nodeId=STATE.entities.company;
    STATE.entities.company='none';
    const sel=$('fCompany');if(sel)sel.value='none';
  }else{
    if(!STATE.entities[slot])return;
    const otherActive=(STATE.entities.company!=='none')||(slot==='trust'?STATE.entities.cis:STATE.entities.trust);
    if(!otherActive){
      alert('A structure needs at least one entity. Add another entity first, or change this in Section 1.');
      return;
    }
    nodeId=slot;
    STATE.entities[slot]=false;
    const cb=$(slot==='trust'?'fTrust':'fCis');if(cb)cb.checked=false;
  }
  resetFees();
  renderSectionToggles();
  removeCoreNodeFromStruct(nodeId);
  syncCellFees();
  renderStructEditorUI();
  redrawStructure();
}

function removeCoreNodeFromStruct(id){
  const st=STATE.struct;if(!st)return;
  const node=st.nodes.find(n=>n.id===id);if(!node)return;

  /* a removed CIS takes its cells with it */
  const childIds=new Set();
  if(id==='cis')collectDownstream(st,id).forEach(cid=>{if(cid!==id)childIds.add(cid);});

  /* bridge the gap: reconnect whatever pointed at this node straight to
     whatever this node pointed at, so the chain doesn't break in two */
  const incoming=st.edges.filter(e=>e.to===id);
  const outgoing=st.edges.filter(e=>e.from===id&&!childIds.has(e.to));
  st.edges=st.edges.filter(e=>e.from!==id&&e.to!==id);
  incoming.forEach(inE=>{
    outgoing.forEach(outE=>{
      st.edges.push({id:newStructId(),from:inE.from,to:outE.to,label:outE.label||inE.label||''});
    });
  });

  st.nodes=st.nodes.filter(n=>n.id!==id&&!childIds.has(n.id));
  st.edges=st.edges.filter(e=>!childIds.has(e.from)&&!childIds.has(e.to));
  childIds.forEach(cid=>{
    ['setup','fixed'].forEach(which=>{STATE.fees[which]=STATE.fees[which].filter(r=>r._nodeId!==cid);});
  });

  /* promote a new headline entity if the one that was primary just left */
  if(node.primary){
    const terminal=st.nodes.find(n=>n.kind!=='shareholder'&&!st.edges.some(e=>e.from===n.id));
    if(terminal)terminal.primary=true;
  }
  /* no trust left upstream — the settlor is just a shareholder again */
  if(id==='trust'){
    const sh=st.nodes.find(n=>n.kind==='shareholder');
    if(sh&&sh.label==='SETTLOR')sh.label='SHAREHOLDER';
  }

  const t=structTitleFor(STATE.entities);
  st.title=t.title;st.sub=t.sub;
}

/* single entry point for every on-canvas delete control — routes to the
   Section-1-aware removeCoreEntity() for the four core boxes, or the
   plain removeStructNode() for anything the user added themselves */
function removeAnyNode(id){
  if(id==='ac'||id==='gbc')removeCoreEntity('company');
  else if(id==='trust'||id==='cis')removeCoreEntity(id);
  else removeStructNode(id);
}

function addStructNode(kind){
  const st=STATE.struct;if(!st)return;
  if(kind==='ciscell'&&!STATE.entities.cis)return; /* add a CIS first */
  const d=NODE_DIM[kind]||NODE_DIM.box;
  const id=newStructId();
  const defaults={shareholder:'SHAREHOLDER',box:'ENTITY',ciscell:'NEW CELL'};
  const count=st.nodes.filter(n=>n.kind===kind).length;
  const maxY=st.nodes.reduce((m,n)=>Math.max(m,n.y+(NODE_DIM[n.kind]||NODE_DIM.box).h),0);
  const x=8+count*(d.w+6);
  const y=kind==='shareholder'?8:Math.min(maxY+10,st.canvasH-d.h-4);
  st.nodes.push({id:id,kind:kind,label:defaults[kind],x:x,y:y,primary:false,cap:''});
  const target=defaultConnectTarget(st,kind);
  if(target){
    if(kind==='ciscell')st.edges.push({id:newStructId(),from:target,to:id,label:''});
    else st.edges.push({id:newStructId(),from:id,to:target,label:''});
  }
  st.canvasH=Math.max(st.canvasH,y+d.h+12);

  /* keep the fee table honest about whatever just got added to the
     diagram — a scaled line for CIS cells, a reminder line for a
     custom entity box there's no price-book entry for */
  if(kind==='ciscell'){
    syncCellFees();
  }else if(kind==='box'){
    ['setup','fixed'].forEach(which=>{
      STATE.fees[which].push({t:'item',l:'Additional entity — set fee',v:0,_nodeId:id});
    });
    renderFeeEditor();
  }

  renderStructEditorUI();
  redrawStructure();
}

function removeStructNode(id){
  const st=STATE.struct;if(!st||st.nodes.length<=1)return;
  if(CORE_NODE_IDS.includes(id))return; /* use the Section 1 toggles instead */
  const removed=st.nodes.find(n=>n.id===id);
  st.nodes=st.nodes.filter(n=>n.id!==id);
  st.edges=st.edges.filter(e=>e.from!==id&&e.to!==id);

  const hadFeeLine=['setup','fixed'].some(which=>STATE.fees[which].some(r=>r._nodeId===id));
  ['setup','fixed'].forEach(which=>{
    STATE.fees[which]=STATE.fees[which].filter(r=>r._nodeId!==id);
  });
  if(removed&&removed.kind==='ciscell')syncCellFees();
  else if(hadFeeLine)renderFeeEditor();

  renderStructEditorUI();
  redrawStructure();
}

function addStructEdge(){
  const st=STATE.struct;if(!st||st.nodes.length<2)return;
  st.edges.push({id:newStructId(),from:st.nodes[0].id,to:st.nodes[1].id,label:''});
  renderStructEditorUI();
  redrawStructure();
}

function removeStructEdge(id){
  const st=STATE.struct;if(!st)return;
  st.edges=st.edges.filter(e=>e.id!==id);
  renderStructEditorUI();
  redrawStructure();
}

function resetStructure(){
  const p=currentSpec();
  if(!p.structure)return;
  STATE.struct=JSON.parse(JSON.stringify(p.structure));
  /* drop any placeholder fee lines that belonged to custom boxes the
     reset just removed, then re-scale the CIS cell line back to the
     fresh default cell count */
  ['setup','fixed'].forEach(which=>{
    STATE.fees[which]=STATE.fees[which].filter(r=>!r._nodeId);
  });
  syncCellFees();
  renderStructEditorUI();
  renderFeeEditor();
  redrawStructure();
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   RENDERER
   ═══════════════════════════════════════════════════════════════ */
let PAGENO=0,RUNNING='',PAGES=[];

/* ── image slots ───────────────────────────────────────────────
   Real photography sits on top of a tonal gradient. A missing file
   just falls back to the gradient — never a broken-image icon.
   Run DOUBLE-CLICK-TO-EXTRACT-IMAGES.bat to populate assets/.      */
const ASSET_DIR='assets/';
const GRAD_DARK ="linear-gradient(150deg,#3E2436 0%,#241028 55%,#160A1C 100%)";
const GRAD_LIGHT="linear-gradient(150deg,#DDE3E7 0%,#C6CFD6 100%)";

function slot(name,label,o){
  o=o||{};
  let cls='imgslot'+(o.light?' light':'')+(o.contain?' contain':'')+(o.cls?' '+o.cls:'');
  let st=o.style||'';
  if(name){
    st += o.contain
      ? "background-image:url('"+ASSET_DIR+name+".png');"
      : "background-image:url('"+ASSET_DIR+name+".png'),"+(o.light?GRAD_LIGHT:GRAD_DARK)+";";
  }
  return '<div class="'+cls+'" data-slot="'+(label||'')+'" style="'+st+'">'+(o.inner||'')+'</div>';
}

/* which leaf-wheel graphic belongs to which service page */
const LEAF_IMG={board:'leaf-board',accounting:'leaf-accounting',legal:'leaf-legal',
  compliance:'leaf-compliance',it:'leaf-it',concierge:'leaf-concierge',media:'leaf-plain'};

/* Reliable gold rosette — a hand-built SVG, not an emoji glyph. Browsers
   render "❀" inconsistently (that red-outline circle you saw is Chrome's
   fallback box for a font that lacks the glyph). currentColor lets CSS set
   the fill. */
function ornamentSVG(size){
  size=size||'1em';
  return '<svg viewBox="0 0 32 32" width="'+size+'" height="'+size+
    '" style="display:inline-block;vertical-align:-0.12em" aria-hidden="true">'+
    '<g fill="currentColor">'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(0 16 16)"/>'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(45 16 16)"/>'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(90 16 16)"/>'+
    '<ellipse cx="16" cy="16" rx="4.1" ry="7.6" transform="rotate(135 16 16)"/>'+
    '<circle cx="16" cy="16" r="2.6" fill="#fff" fill-opacity=".35"/>'+
    '</g></svg>';
}

/* Larger, more detailed gold rosette used only on the "Our Group" page —
   two rings (outer dot ring + petal ring) plus a bordered inner disc, closer
   in spirit to the mandala on the source page without trying to trace it
   pixel-for-pixel (that artwork is vector-only in the source PDF and not
   recoverable as an asset). */
function mandalaSVG(size){
  size=size||'26mm';
  let petals='';
  const n=16;
  for(let i=0;i<n;i++){
    const ang=i*(360/n);
    petals+='<ellipse cx="50" cy="27" rx="4" ry="12" transform="rotate('+ang+' 50 50)" fill="currentColor" fill-opacity=".82"/>';
  }
  let dots='';
  const dn=28;
  for(let i=0;i<dn;i++){
    const ang=i*(360/dn)*Math.PI/180;
    const cx=50+43*Math.cos(ang), cy=50+43*Math.sin(ang);
    dots+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="1.5" fill="currentColor"/>';
  }
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+
    '" style="display:block;margin:0 auto;color:var(--gold)" aria-hidden="true">'+
    '<g>'+dots+petals+
    '<circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="1.1"/>'+
    '<circle cx="50" cy="50" r="6.5" fill="currentColor"/>'+
    '</g></svg>';
}

/* Gold "bracket" rule used to underline a category header spanning one or
   more columns — a horizontal hairline with short vertical ticks turning
   down at each end. Stretches to fill its flex container (non-uniform
   scaling via preserveAspectRatio="none"), stroke width held constant via
   vector-effect. */
function bracketSVG(){
  return '<svg viewBox="0 0 100 10" preserveAspectRatio="none" '+
    'style="display:block;width:100%;height:3mm" aria-hidden="true">'+
    '<path d="M2 2 L2 8 M2 2 L98 2 M98 2 L98 8" stroke="#B59433" stroke-width="1.4" '+
    'fill="none" vector-effect="non-scaling-stroke"/></svg>';
}

/* Small inline flag icons — simple, print-safe, no external font/image
   dependency. Approximations of the national flags, sized for a caption row. */
function flagSVG(country){
  const common='style="display:inline-block;vertical-align:-1px;margin-right:1.2mm;border:.25px solid #00000022"';
  if(country==='Mauritius'){
    return '<svg width="4.6mm" height="3mm" viewBox="0 0 30 20" '+common+'>'+
      '<rect width="30" height="5" y="0" fill="#EA2839"/>'+
      '<rect width="30" height="5" y="5" fill="#1A206D"/>'+
      '<rect width="30" height="5" y="10" fill="#FFD500"/>'+
      '<rect width="30" height="5" y="15" fill="#00A551"/></svg>';
  }
  if(country==='United Arab Emirates'){
    return '<svg width="4.6mm" height="3mm" viewBox="0 0 30 20" '+common+'>'+
      '<rect width="30" height="6.67" y="0" fill="#00843D"/>'+
      '<rect width="30" height="6.67" y="6.67" fill="#FFFFFF"/>'+
      '<rect width="30" height="6.66" y="13.34" fill="#000000"/>'+
      '<rect width="9" height="20" fill="#EF3340"/></svg>';
  }
  if(country==='Canada'){
    return '<svg width="4.6mm" height="3mm" viewBox="0 0 30 20" '+common+'>'+
      '<rect width="30" height="20" fill="#FFFFFF"/>'+
      '<rect width="7.5" height="20" x="0" fill="#FF0000"/>'+
      '<rect width="7.5" height="20" x="22.5" fill="#FF0000"/>'+
      '<path d="M15 4l1 3 2.5-1.4-.8 2.6 2.3.2-1.8 1.8 1.2 1-2 .3.3 1.8-1.7-.9-.2 2h-2l-.2-2-1.7.9.3-1.8-2-.3 1.2-1-1.8-1.8 2.3-.2-.8-2.6L14 7z" fill="#FF0000"/></svg>';
  }
  return '';
}

/* Groups BP.ourGroupEntities into category clusters, reading the same
   {cat:'X',...},{cat:'',...},{cat:'',...} convention already used in the
   data (a non-empty cat starts a new group; an empty cat continues the
   previous one). */
function groupByCategory(entities){
  const groups=[];
  entities.forEach(e=>{
    if(e.cat){groups.push({cat:e.cat,items:[e]});}
    else if(groups.length){groups[groups.length-1].items.push(e);}
    else{groups.push({cat:'',items:[e]});}
  });
  return groups;
}

/* The utility "crest" badge repeated in the corner of every content page.
   White pages use the full-colour lockup (navy wordmark); dark/photo pages
   use the white-gradient SVG, which has a white wordmark and a gold
   gradient emblem so it sits directly on the artwork. Earlier versions had
   to put a white chip behind the full-colour logo on dark pages to keep the
   navy wordmark legible — that chip is no longer needed and has been
   removed everywhere the white logo is used. */
/* The two logo files have DIFFERENT amounts of built-in whitespace around
   the artwork, so the same top/right/height would place them differently.
   Measured against the source PDF (see the sizing note on logoImgWhite):
     logo-white.svg       content = 80.07% of width, 63.26% of height,
                          inset 9.93% from left, 18.37% from top
     logo-full-color.png  content = 100% of width, 93.26% of height,
                          inset 0% from left, 3.95% from top
   The offsets below are back-calculated from where the crest actually sits
   on the source pages (content 17.6-17.9mm wide, ~11.7mm from the top,
   ~264.3mm from the left) so both variants land in the same visual spot. */
function crest(dark){
  const pos=dark?'top:8.27mm;right:12.89mm':'top:11.15mm;right:14.83mm';
  return '<div class="crest" style="'+pos+'">'+
    (dark?logoImgWhite('19.23mm'):logoImg('13.24mm'))+'</div>';
}

/* White-on-dark variant of the lockup. Self-contained SVG (white vector
   wordmark + embedded gold-gradient emblem), so it needs no chip behind it
   the way the navy-wordmark PNG did.

   Sizing note: this artwork carries a wide transparent margin — the visible
   logo is only 80.07% of the file's width and 63.26% of its height — so the
   height passed in here is always noticeably larger than the logo appears.
   Callers pass a height derived from the measured on-page size in the
   source deck rather than the apparent size, and max-width is released
   because the cover lockup is wider than the 32mm .logoimg cap. */
function logoImgWhite(height){
  return '<img class="logoimg" style="height:'+height+';max-width:none;display:block" '+
    'src="'+ASSET_DIR+'logo-white.svg" '+
    'onerror="logoFallbackWhite(this)">';
}

/* Dark-page fallback, kept separate from logoFallback() on purpose.
   The only substitute available is the full-colour PNG, whose wordmark is
   near-black — dropped straight onto a plum page or a night photograph it
   reads as "the logo is broken/missing" rather than as a fallback, which is
   exactly what happens when logo-white.svg hasn't been deployed alongside
   the HTML. So when we fall back here we also restore the white chip the
   navy wordmark needs, trading exact fidelity for something legible. */
function logoFallbackWhite(img){
  img.onerror=null;
  img.src=ASSET_DIR+'logo-full-color.png';
  img.style.background='#fff';
  img.style.borderRadius='2mm';
  img.style.padding='1.4mm 2.2mm';
  /* the chip's padding would otherwise push the lockup past its measured
     size, so shrink the image itself to compensate */
  img.style.height=(parseFloat(img.style.height)*0.62)+'mm';
}

/* Real logo, with a fallback chain so it works whether or not the
   extractor has been run and wherever the file currently lives:
     1) assets/logo-full-color.png   (written by the extractor)
     2) ../logo.png.png              (the file already in your workspace)
     3) CSS text lockup              (always works, no image needed)
   onerror walks this chain once, then gives up gracefully. */
function logoImg(height){
  const id='logo'+(Math.random()*1e9|0);
  return '<img id="'+id+'" class="logoimg" style="height:'+height+';display:block" '+
    'src="'+ASSET_DIR+'logo-full-color.png" '+
    'data-fallback="../logo.png.png" '+
    'onerror="logoFallback(this)">';
}
function logoFallback(img){
  const next=img.getAttribute('data-fallback');
  if(next){
    img.removeAttribute('data-fallback');
    img.src=next;
  }else{
    /* both image paths failed — swap in the text lockup so nothing looks broken */
    const span=document.createElement('span');
    span.innerHTML='<span style="font-family:var(--serif);font-size:11pt;color:var(--navy);'+
      'line-height:1;display:inline-flex;align-items:center;gap:2px">'+
      '<span style="color:var(--gold)">'+ornamentSVG('10pt')+'</span>aurevya</span>';
    img.replaceWith(span.firstChild);
  }
}
function foot(){
  PAGENO++;
  return '<div class="pfoot"><span class="l">AUREVYA WEALTH</span>'+
    '<span class="c">'+RUNNING+'</span>'+
    '<span class="r">A KUNDOMAL &amp; CO ENTERPRISE</span><span class="n">'+PAGENO+'</span></div>';
}
function page(inner,cls){
  return '<div class="page '+(cls||'')+'">'+inner+'</div>';
}

/* ── individual page builders ─────────────────────────── */
function pgCover(p,d){
  return page('<div class="cover">'+
    slot('cover-photograph','cover photograph',{cls:'art',inner:'<div class="tag">'+BP.tagline+'</div>'})+
    '<div class="pane">'+
      /* 50.02mm renders the visible lockup at the 45.8 x 31.0mm it measures
         on the source cover (the file's own transparent margin accounts for
         the rest) — see the sizing note on logoImgWhite. */
      '<div class="mark">'+logoImgWhite('50.02mm')+'</div>'+
      '<div class="t1">'+p.coverT1+'</div><div class="t2">'+p.coverT2+'</div>'+
      (p.coverT3?'<div class="t1" style="font-size:10pt;margin-top:1mm">'+p.coverT3+'</div>':'')+
      '<div class="rule"></div>'+
      '<div class="pf">Prepared for</div><div class="cn">'+(d.client||'—')+'</div>'+
      '<div class="dt">'+d.month+'&nbsp; '+d.year+'</div>'+
      '<div class="ent">'+BP.enterprise+'</div>'+
    '</div></div>','nofoot');
}

function pgDisclaimer(){
  return page(crest()+'<div class="pbody" style="background:var(--paper-alt)">'+
    '<div class="disclaimerbox"><h4>Disclaimer</h4><div class="dc">'+
    BP.disclaimer.map(t=>'<p>'+t+'</p>').join('')+
    '</div></div>'+foot()+'</div>');
}

function pgContents(toc){
  return page('<div class="contents">'+
    slot('contents-photograph','contents photograph')+
    '<div class="list">'+crest()+'<h1 class="ptitle">Contents</h1>'+
    '<div class="toc">'+toc.map(t=>'<div class="ti"><span class="tt">'+t[0]+'</span><span class="tn">'+t[1]+'</span></div>').join('')+'</div>'+
    foot()+'</div></div>');
}

function pgGlossary(terms){
  const per=Math.ceil(terms.length/4);
  let cols='';
  for(let i=0;i<4;i++){
    cols+='<div class="col">'+terms.slice(i*per,(i+1)*per).map(t=>
      '<div class="term">'+t[0]+'</div><div class="def">'+t[1]+'</div>').join('')+'</div>';
  }
  return page(crest()+'<div class="pbody"><h1 class="ptitle">Glossary <em>of Terms</em></h1>'+
    '<div class="cols c4">'+cols+'</div>'+foot()+'</div>');
}

function pgOurGroup(){
  /* Subsidiary logos are vector artwork in the source PDFs, not embedded
     raster images — there is nothing for the extractor to pull out for
     these. Each card looks for assets/logo-<slug>.png (see README for the
     exact filenames) and falls back to a clean gold-rule+name typographic
     treatment if the file hasn't been supplied yet, so nothing ever looks
     broken either way. */
  const groups=groupByCategory(BP.ourGroupEntities);
  const brackets=groups.map(g=>
    '<div style="flex:'+g.items.length+' 1 0;text-align:center;padding:0 2mm">'+
      bracketSVG()+
      '<div style="font-family:var(--serif);font-style:italic;font-size:7.6pt;'+
        'letter-spacing:.03em;color:var(--navy);margin-top:1.3mm">'+g.cat+'</div>'+
    '</div>').join('');
  const cards=BP.ourGroupEntities.map(e=>{
    const logoSrc=ASSET_DIR+'logo-'+(e.logo==='aurevya'?'full-color':e.logo)+'.png';
    const logoHTML='<div style="height:14mm;display:flex;align-items:center;justify-content:center;margin-bottom:3mm">'+
      '<img src="'+logoSrc+'" style="max-height:14mm;max-width:92%;object-fit:contain" '+
      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'+
      '<div style="display:none;width:16mm;height:.8px;background:var(--gold)"></div></div>';
    return '<div class="col" style="display:flex;flex-direction:column;">'+
    logoHTML+
    '<div class="term" style="text-align:center;font-family:var(--serif);font-size:8.4pt">'+e.name+'</div>'+
    '<p style="font-size:6.6pt;text-align:center">'+e.txt+'</p>'+
    (e.partner?(
      '<div style="text-align:center;margin-top:1.5mm">'+
      '<p style="font-size:6.2pt;color:var(--navy);margin:0 0 1mm">'+e.partner+'</p>'+

/* point where a line from a box's centre toward (tx,ty) crosses the
   box's own boundary — used so connectors leave from whichever edge
   actually faces the other node, not always dead-centre top/bottom */
function edgeAnchor(cx,cy,w,h,tx,ty){
  const dx=tx-cx,dy=ty-cy;
  if(dx===0&&dy===0)return{x:cx,y:cy};
  const hw=w/2,hh=h/2;
  const scaleX=dx!==0?hw/Math.abs(dx):Infinity;
  const scaleY=dy!==0?hh/Math.abs(dy):Infinity;
  const scale=Math.min(scaleX,scaleY);
  return{x:cx+dx*scale,y:cy+dy*scale};
}

/* connector lines drawn in an SVG overlay, in the same mm coordinate
   space as the nodes — recomputed on every drag frame, so the lines
   always follow whatever box just moved */
function renderEdgesSVG(st){
  const byId={};st.nodes.forEach(n=>byId[n.id]=n);
  let svg='<svg class="edgesvg" viewBox="0 0 '+st.canvasW+' '+st.canvasH+'" '+
    'style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" xmlns="http://www.w3.org/2000/svg">';
  st.edges.forEach(e=>{
    const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
    const da=NODE_DIM[a.kind]||NODE_DIM.box,db=NODE_DIM[b.kind]||NODE_DIM.box;
    /* connect from whichever side of each box faces the other node, so
       edges between boxes that aren't stacked directly on top of each
       other (e.g. a shareholder feeding in from the side) don't cut
       through the box corners */
    const acx=a.x+da.w/2,acy=a.y+da.h/2,bcx=b.x+db.w/2,bcy=b.y+db.h/2;
    const p1=edgeAnchor(acx,acy,da.w,da.h,bcx,bcy);
    const p2=edgeAnchor(bcx,bcy,db.w,db.h,acx,acy);
    const angle=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    const arrowLen=2.6,arrowW=1.3;
    const tipX=p2.x,tipY=p2.y;
    const backX=tipX-arrowLen*Math.cos(angle),backY=tipY-arrowLen*Math.sin(angle);
    const perpX=Math.sin(angle)*arrowW,perpY=-Math.cos(angle)*arrowW;
    svg+='<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+backX+'" y2="'+backY+'" stroke="#130429" stroke-width=".35"/>';
    svg+='<polygon points="'+tipX+','+tipY+' '+(backX+perpX)+','+(backY+perpY)+' '+(backX-perpX)+','+(backY-perpY)+'" fill="#130429"/>';
    if(e.label){
      const mx=(p1.x+p2.x)/2+3.5,my=(p1.y+p2.y)/2;
      svg+='<text x="'+mx+'" y="'+my+'" font-family="Cormorant Garamond, serif" font-style="italic" '+
        'font-size="4.6" fill="#B59433">'+e.label+'</text>';
    }
  });
  svg+='</svg>';
  return svg;
}
