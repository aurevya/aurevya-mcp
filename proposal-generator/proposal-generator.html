    mid='<div class="col"><h4>'+s.colAh+'</h4><ul>'+s.colA.map(b=>'<li>'+b+'</li>').join('')+'</ul></div>'+
      '<div class="col"><h4>'+s.colBh+'</h4><ul>'+s.colB.map(b=>'<li>'+b+'</li>').join('')+'</ul></div><div></div>';
  }else if(s.shape==='legalref'){
    /* statutory reference on the left, the service delivered against it on
       the right — the layout the Directorship and Governance pages use */
    mid='<div class="col"><h4>'+s.colAh+'</h4>'+
      s.colA.map(a=>'<p style="font-weight:600;color:var(--navy)">'+a+'</p>').join('')+'</div>'+
      '<div class="col"><h4>'+s.colBh+'</h4><ul>'+s.colB.map(b=>'<li>'+b+'</li>').join('')+'</ul></div>'+
      '<div></div>';
  }
  return page(crest()+leafCol(key)+'<div class="pbody"><div class="peyebrow">OUR SERVICES</div>'+
    '<h1 class="ptitle">'+s.title+(s.pair?' &nbsp;&nbsp; <span style="color:var(--gold)">'+s.pair+'</span>':'')+'</h1>'+
    '<div class="svcpage" style="margin-top:5mm">'+
    '<div class="cols c3" style="margin-top:0">'+mid+'</div></div>'+
    foot()+'</div>');
}

function pgBack(p){
  return page('<div class="backcover">'+
    '<div class="bt">'+p.coverT1+'<br><b>'+p.coverT2+'</b></div>'+
    '<div class="bm">'+logoImgWhite('31.88mm')+'</div>'+
    '<div class="addr">'+BP.address+'<br><br>'+BP.contact+'</div>'+
    '<div class="ent">'+BP.enterprise+'</div>'+
    '<div class="lic">'+BP.licence+'</div>'+
    '</div>','dark nofoot');
}

/* ── assemble ─────────────────────────────────────────── */
function build(){
  const p=currentSpec();
  const d={client:$('fClient').value.trim(),
    month:MONTHS[+$('fMonth').value],year:$('fYear').value,
    currency:$('fCurrency').value};
  PAGENO=1;RUNNING=p.running;   /* cover is page 1, unnumbered */
  const on=s=>STATE.sections[s];

  /* glossary scope */
  let terms=[];
  if(p.glossary.includes('base'))terms=terms.concat(BP.glossaryBase);
  if(p.glossary.includes('trust'))terms=terms.concat(BP.glossaryTrust);
  if(p.glossary.includes('fund'))terms=terms.concat(BP.glossaryFund);
  terms.sort((a,b)=>a[0].localeCompare(b[0]));

  /* first pass — build pages, capturing TOC positions */
  let html='',toc=[];
  html+=pgCover(p,d);

  /* Tag each page with the section that produced it, so the live rebuild can
     put you back on the page you were looking at instead of guessing from a
     scroll ratio — see liveBuild(). Purely an editing aid; stripped from
     the exported HTML along with the other .noprint chrome. */
  const emit=(s)=>{
    const out=emitPage(s);
    return out?out.replace('<div class="page ','<div data-sec="'+s+'" class="page '):'';
  };

  const emitPage=(s)=>{
    if(!on(s))return '';
    const n=PAGENO+1;
    switch(s){
      case 'disclaimer': return pgDisclaimer();
      case 'contents':   return '<!--TOC-->';
      case 'glossary':   toc.push(['Glossary Of Terms',n]);return pgGlossary(terms);
      case 'ourgroup':   toc.push(['Our Group',n]);return pgOurGroup();
      case 'about':      return pgAbout();
      case 'whatwedo':   toc.push(['What We Do',n]);return pgWhatWeDo();
      case 'structdivider': toc.push([p.structure?p.structure.title.replace(/<br>/g,' '):'Tailored Solution',n]);
                         return pgDivider('Your<br>Tailored<br>Solution','');
      case 'structure':  return p.structure?pgStructure(STATE.struct):'';
      case 'ackeydivider': return pgDivider(AC_KEYFEATURES.divider.h,'');
      case 'ackeyfeatures':toc.push(['Key Features of an Authorised Company',n]);return pgACKeyFeatures();
      case 'gbcdivider': toc.push(['Global Business Company (GBC) in Mauritius',n]);
                         return pgDivider(GBC_OVERVIEW.divider.h,GBC_OVERVIEW.divider.s,'gbc-divider-photograph');
      case 'gbcoverview':return pgGBCOverview(1)+pgGBCOverview(2)+pgGBCOverview(3);
      case 'cisdivider': toc.push(['Collective Investment Scheme',n]);
                         return pgDivider(CIS_CONTENT.divider.h,CIS_CONTENT.divider.s,'cis-divider-photograph');
      case 'cisoverview':return pgCIS();
      case 'trustfacts': toc.push(['Key Facts About The Mauritius Trust',n]);return pgTrustFacts();
      case 'trustparties':toc.push(['Key Parties To A Trust',n]);return pgTrustParties();
      case 'trustvalidity':toc.push(['Trust Validity',n]);return pgTrustValidity();
      case 'docprocess_trust': if(!toc.some(t=>t[0]==='Documentation Process'))toc.push(['Documentation Process',n]);
                         return pgDocProcess('trust');
      case 'docprocess_company': if(!toc.some(t=>t[0]==='Documentation Process'))toc.push(['Documentation Process',n]);
                         return pgDocProcess(p.docKeyCompany);
      case 'docprocess_cis': if(!toc.some(t=>t[0]==='Documentation Process'))toc.push(['Documentation Process',n]);
                         return pgDocProcess('cis');
      case 'docprocess': if(!toc.some(t=>t[0]==='Documentation Process'))toc.push(['Documentation Process',n]);
                         return pgDocProcess(p.docprocess);
      case 'kyc':        toc.push(['KYC Documents',n]);return pgKYC(STATE.mode!=='accounting');
      case 'feesetup':   toc.push(['Fee Quote',n]);return pgFee('setup',d);
      case 'feefixed':   return pgFee('fixed',d);
      case 'feecombined':toc.push(['Fee Quote',n]);return pgFeeCombined(d);
      case 'leaf':       toc.push(['Our Services',n]);return pgLeaf();
      case 'svc_board':      return pgService('board');
      case 'svc_accounting': return pgService('accounting');
      case 'svc_legal':      return pgService('legal');
      case 'svc_compliance': return pgService('compliance');
      case 'svc_it':         return pgService('it');
      case 'svc_concierge':  return pgService('concierge');
      case 'svc_media':      return pgService('media');
      case 'svc_directorship': return pgService('directorship');
      case 'svc_governance':   return pgService('governance');
      case 'back':       return pgBack(p);
    }
    return '';
  };

  /* keep the product's canonical order, plus disclaimer if re-enabled */
  let seq=p.sections.filter(s=>on(s));
  if(on('disclaimer')&&!seq.includes('disclaimer'))seq.unshift('disclaimer');

  /* reserve the contents page number before emitting the rest */
  let contentsAt=null;
  seq.forEach(s=>{
    if(s==='contents'){contentsAt=++PAGENO;html+='<!--TOC-->';}
    else html+=emit(s);
  });

  if(contentsAt!==null){
    html=html.replace('<!--TOC-->',(function(){
      const save=PAGENO;PAGENO=contentsAt-1;
      const out=pgContents(toc);PAGENO=save;return out;
    })());
  }

  $('previewInner').innerHTML=html;
  $('tbInfo').innerHTML='<b>'+p.label+'</b> — '+PAGENO+' pages · '+
    (d.client||'no client name')+' · '+d.month+' '+d.year+
    ' · Setup '+curSym()+' '+money(feeTotal('setup'))+
    ' · Annual '+curSym()+' '+money(feeTotal('fixed'));
}

/* ── export ───────────────────────────────────────────── */
function proposalSlug(){
  if(STATE.mode!=='structure')return STATE.mode.toUpperCase();
  const e=STATE.entities,parts=[];
  if(e.trust)parts.push('TRUST');
  if(e.company!=='none')parts.push(e.company.toUpperCase());
  if(e.cis)parts.push('CIS');
  return parts.join('_')||'STRUCTURE';
}

/* Pure builder — returns the standalone-file HTML string without touching
   the DOM outside #previewInner or triggering a browser download. Kept
   separate from downloadHTML() so the exact same export logic can be
   driven headlessly (see mcp-server/lib/proposal.js, which calls
   window.buildExportHTML() from a headless Chromium tab) as well as from
   the in-app "Download HTML" button, with zero duplicated logic. */
function buildExportHTML(){
  const p=currentSpec();
  const css=document.querySelector('style').innerHTML;
  /* strip editing-only UI (the on-canvas "+" toolbar, etc.) so a
     downloaded/emailed file never shows controls that don't do anything
     without the app's JS behind them */
  const clone=$('previewInner').cloneNode(true);
  clone.querySelectorAll('.noprint').forEach(el=>el.remove());
  /* data-sec exists only so the live preview can hold its scroll position;
     it has no business in a delivered document */
  clone.querySelectorAll('[data-sec]').forEach(el=>el.removeAttribute('data-sec'));
  const body=clone.innerHTML;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+
    p.label+' — '+($('fClient').value||'Proposal')+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">'+
    '<style>'+css+'\nbody{background:#fff}#app{display:block}#preview{padding:20px;height:auto}</style></head>'+
    '<body><div id="previewInner">'+body+'</div></body></html>';
}
function exportFilename(){
  // A timestamp suffix keeps every export unique — without it, two
  // proposals for the same client + same entity combination (e.g. an
  // earlier draft missing a Trust, then a corrected one) produce the exact
  // same filename, which can lead to a browser/PDF viewer silently
  // reopening or overwriting the older file instead of the new one.
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
  return 'AUREVYA_'+proposalSlug()+'_'+
    ($('fClient').value||'PROPOSAL').replace(/[^a-zA-Z0-9]/g,'_')+'_'+stamp+'.html';
}
function downloadHTML(){
  const doc=buildExportHTML();
  const blob=new Blob([doc],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=exportFilename();
  a.click();
}

let ZOOM=1;
function zoom(dir){
  ZOOM=Math.max(.4,Math.min(1.6,ZOOM+dir*.1));
  $('previewInner').style.transform='scale('+ZOOM+')';
  $('previewInner').style.transformOrigin='top center';
}

/* ═══════════════════════════════════════════════════════════════
   LIVE PREVIEW
   Any change in the sidebar rebuilds the deck. Debounced so typing
   stays smooth, and the scroll position is held so the page you are
   looking at does not jump away mid-edit.
   ═══════════════════════════════════════════════════════════════ */
let _liveTimer=null,_liveFlag=null;

function liveBuild(delay){
  const pv=$('preview'),inner=$('previewInner'),flag=$('tbLive');
  if(flag){flag.classList.add('on');clearTimeout(_liveFlag);}
  clearTimeout(_liveTimer);
  _liveTimer=setTimeout(function(){
    /* Hold the reader's place by anchoring to an actual page, not to a
       fraction of the deck's height. The old proportional fallback assumed
       the deck grows evenly, but pages get inserted at one specific point:
       adding an entity inserts its pages mid-deck, so the same ratio landed
       on a different page and the preview appeared to jump. Anchoring to the
       section you were looking at is exact regardless of what was inserted
       or where. */
    const prevH=inner.scrollHeight||1;
    const y=pv.scrollTop;

    /* whichever page currently occupies the top of the viewport, and how far
       into it we are */
    let anchorSec=null,anchorDelta=0;
    const pages=inner.querySelectorAll('.page[data-sec]');
    for(let i=0;i<pages.length;i++){
      const top=pages[i].offsetTop,h=pages[i].offsetHeight;
      if(y<top+h-1){
        anchorSec=pages[i].getAttribute('data-sec');
        anchorDelta=y-top;
        break;
      }
    }

    build();

    let done=false;
    if(anchorSec){
      const el=inner.querySelector('.page[data-sec="'+anchorSec+'"]');
      if(el){pv.scrollTop=Math.max(0,el.offsetTop+anchorDelta);done=true;}
    }
    if(!done){
      /* nothing to anchor to (the section was switched off, or we were above
         the first tagged page) — fall back to holding the raw offset */
      const newH=inner.scrollHeight||1;
      pv.scrollTop=Math.min(y,Math.max(0,newH-pv.clientHeight));
    }

    _liveFlag=setTimeout(function(){if(flag)flag.classList.remove('on');},260);
  },delay===undefined?130:delay);
}

/* Delegated listeners. The inline oninput/onchange handlers on each field
   update STATE first (they fire at the target); this catches the bubble
   afterwards and redraws. New fields added later are covered automatically. */
(function bindLive(){
  const sb=$('sidebar');
  sb.addEventListener('input',function(e){
    if(e.target.matches('input,select,textarea'))liveBuild();
  });
  sb.addEventListener('change',function(e){
    if(e.target.matches('input,select,textarea')){
      /* product/section switches restructure the deck — redraw promptly */
      liveBuild(e.target.type==='checkbox'||e.target.tagName==='SELECT'?0:130);
    }
  });
  /* keyboard niceties */
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();window.print();}
    if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+')){e.preventDefault();zoom(1);}
    if((e.ctrlKey||e.metaKey)&&e.key==='-'){e.preventDefault();zoom(-1);}
  });
})();

/* Drag-to-reposition on the structure diagram. Delegated on #preview
   (which persists across rebuilds — #previewInner is what gets
   replaced), so it keeps working after every liveBuild() redraw.
   During the drag itself we mutate the DOM directly for a smooth 60fps
   feel instead of re-running the full build(); mouseup does one real
   liveBuild() to keep everything else (TOC, page count) in sync. */
(function bindStructureDrag(){
  const pv=$('preview');
  let dragging=null;
  pv.addEventListener('mousedown',function(e){
    const el=e.target.closest('.dragnode');
    if(!el||!STATE.struct)return;
    const canvas=el.closest('.freecanvas');if(!canvas)return;
    const id=el.getAttribute('data-nid');
    const node=STATE.struct.nodes.find(n=>n.id===id);
    if(!node)return;
    const rect=canvas.getBoundingClientRect();
    /* getBoundingClientRect already accounts for any scale applied to fit
       the chart on the page, so dividing by the canvas's own logical size
       gives the right pixels-per-mm either way */
    const cw=+canvas.getAttribute('data-cw')||STATE.struct.canvasW;
    const ch=+canvas.getAttribute('data-ch')||STATE.struct.canvasH;
    dragging={id:id,canvas:canvas,startX:e.clientX,startY:e.clientY,startNX:node.x,startNY:node.y,
      moved:false,limX:cw,limY:ch,
      pxPerMMx:rect.width/cw,pxPerMMy:rect.height/ch};
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging||!STATE.struct)return;
    const node=STATE.struct.nodes.find(n=>n.id===dragging.id);if(!node)return;
    const d=nodeDim(node);
    /* a few px of slop, so a click with a shaky hand still counts as a
       click and opens the panel rather than nudging the box */
    if(Math.abs(e.clientX-dragging.startX)>3||Math.abs(e.clientY-dragging.startY)>3)dragging.moved=true;
    if(!dragging.moved)return;
    const dx=(e.clientX-dragging.startX)/dragging.pxPerMMx;
    const dy=(e.clientY-dragging.startY)/dragging.pxPerMMy;
    node.x=Math.max(0,Math.min(dragging.limX-d.w,dragging.startNX+dx));
    node.y=Math.max(0,Math.min(dragging.limY-d.h,dragging.startNY+dy));
    const el=dragging.canvas.querySelector('.dragnode[data-nid="'+dragging.id+'"]');
    if(el){el.style.left=node.x+'mm';el.style.top=node.y+'mm';}
    const cap=dragging.canvas.querySelector('.nodecap[data-cap-for="'+dragging.id+'"]');
    if(cap){
      cap.style.left=(node.x+capOffset(STATE.struct,node))+'mm';
      cap.style.top=(node.y+d.h+1.5)+'mm';
    }
    const svgHost=dragging.canvas.querySelector('.edgesvg');
    if(svgHost)svgHost.outerHTML=renderEdgesSVG(STATE.struct);
  });
  document.addEventListener('mouseup',function(){
    if(!dragging)return;
    const wasClick=!dragging.moved,id=dragging.id;
    dragging=null;
    if(wasClick){openEntityPanel(id);return;}
    liveBuild(0);
  });
})();

initWizard();
build();          /* draw immediately on load — nothing to click */
</script>
